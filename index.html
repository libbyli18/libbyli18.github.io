<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          // Two colours only. Everything else is a blend of the two, so the
          // whole palette sits on a single ink -> cream line with no hue of
          // its own — the tints below are that line at 5%, 78% and 71% ink.
          cream: "#F6F2E8",
          "cream-2": "#EBE7DD",
          ink: "#1B1815",
          "ink-mid": "#4B4843",
          "ink-soft": "#5B5752",
        },
        fontFamily: {
          display: ['"Fraunces"', "serif"],
          name: ['"EB Garamond"', "Garamond", "Georgia", "serif"],
          mono: ['"IBM Plex Mono"', "monospace"],
          body: ['"Work Sans"', "sans-serif"],
        },
      },
    },
  };
</script>

<style>
  :root {
    --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    --line: rgba(27, 24, 21, 0.14);
  }

  * { box-sizing: border-box; }

  /* Every view is exactly one screen. Nothing scrolls past its edges — no
     page scroll, and no rubber-band overscroll at the boundaries either. */
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: #F6F2E8;
    color: #1B1815;
  }

  /* ---------- Grain overlay ---------- */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 9998;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---------- Top / bottom rules ---------- */
  .rule-top, .rule-bottom {
    position: fixed;
    left: 0; right: 0;
    height: 2px;
    background: #1B1815;
    z-index: 9999;
  }
  .rule-top { top: 0; }
  .rule-bottom { bottom: 0; }

  /* ---------- Header ---------- */
  .site-header {
    transition: background-color 0.4s ease;
    /* The header's own box spans the full viewport width at a fixed z-index
       (9999) even where nothing is rendered in it (the whole right side, on
       desktop, since the mobile menu button is hidden there) — which was
       silently swallowing clicks meant for the lightbox's close button
       underneath it, since z-index only orders full stacking contexts, not
       "empty" regions within one. Reopening pointer-events on just the real
       interactive children lets clicks fall through everywhere else. */
    pointer-events: none;
  }
  .site-header a, .site-header button {
    pointer-events: auto;
  }

  .nav-link {
    position: relative;
    padding-bottom: 3px;
  }
  .nav-link::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.4s var(--ease-spring);
  }
  .nav-link:hover::after,
  .nav-link:focus-visible::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  /* ---------- Pills ---------- */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #F6F2E8;
    transition: transform 0.35s var(--ease-spring),
      box-shadow 0.35s var(--ease-spring),
      border-color 0.35s var(--ease-spring),
      background-color 0.35s var(--ease-spring);
    box-shadow: 0 1px 2px rgba(27,24,21,0.05);
  }
  .pill:hover {
    transform: translateY(-2px);
    border-color: rgba(27,24,21,0.42);
    box-shadow: 0 1px 2px rgba(27,24,21,0.06), 0 10px 24px -10px rgba(27,24,21,0.42);
  }
  .pill:active { transform: translateY(0px) scale(0.98); }
  .pill:focus-visible {
    outline: 2px solid #1B1815;
    outline-offset: 2px;
  }

  /* ---------- Hero ---------- */
  /* Hero elements converge on one beat: everything above centre drops in from
     the top, everything below it rises from the bottom. No stagger — the
     direction does the work, so they all land together. */
  .hero-line {
    display: block;
    opacity: 0;
    animation-duration: 1s;
    animation-timing-function: var(--ease-spring);
    animation-fill-mode: forwards;
  }
  .hero-line.from-top { animation-name: heroDropIn; }
  .hero-line.from-bottom { animation-name: heroRiseIn; }
  @keyframes heroDropIn {
    from { opacity: 0; transform: translateY(-80px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes heroRiseIn {
    from { opacity: 0; transform: translateY(80px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .float-slow {
    animation: float 7s ease-in-out infinite;
  }
  .float-slow-rev {
    animation: float 8s ease-in-out infinite reverse;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  /* ---------- Photo reveal ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 0.8s var(--ease-spring), transform 0.8s var(--ease-spring);
  }
  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- Horizontal gallery (2D scatter field) ---------- */
  /* Photos are absolutely placed across a wide, full-height track so they
     fill the whole page vertically as well as horizontally — the track
     scrolls sideways. */
  .gallery-viewport {
    overflow-x: auto;
    overflow-y: hidden;
    /* The track is the only thing that moves; hitting either end stops dead
       rather than bouncing the page or triggering a back-swipe. */
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    cursor: grab;
    height: 100dvh;
  }
  .gallery-viewport::-webkit-scrollbar { display: none; }
  .gallery-viewport.dragging { cursor: grabbing; }

  .gallery-track {
    position: relative;
    height: 100%;
    width: 170vw;
  }
  @media (max-width: 860px) { .gallery-track { width: 430vw; } }

  .photo-card {
    position: absolute;
    cursor: pointer;
  }

  .scroll-cue {
    position: absolute;
    left: 12%;
    top: 84%;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }

  .back-pill {
    position: fixed;
    bottom: 1.75rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
  }
  /* Keep the centered pill's hover/active lift from cancelling the centering. */
  .back-pill:hover { transform: translateX(-50%) translateY(-2px); }
  .back-pill:active { transform: translateX(-50%) scale(0.98); }

  .photo-frame {
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    background: #EBE7DD;
    box-shadow: 0 1px 2px rgba(27,24,21,0.06), 0 14px 30px -18px rgba(27,24,21,0.35);
    transition: transform 0.55s var(--ease-spring), box-shadow 0.55s var(--ease-spring);
  }
  .photo-card:hover .photo-frame, .photo-card:focus-visible .photo-frame {
    transform: translateY(-6px);
    box-shadow: 0 4px 10px rgba(27,24,21,0.08), 0 28px 50px -20px rgba(27,24,21,0.45);
  }
  /* With the cursor magnifier running, scale is driven per-frame from JS.
     Drop the transition so it doesn't lag the pointer, and drop the inner
     image zoom so the photo doesn't get scaled twice. */
  .magnify .photo-frame { transition: box-shadow 0.55s var(--ease-spring); }
  .magnify .photo-card:hover img { transform: none; }
  .photo-card img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.7s var(--ease-spring), filter 0.5s ease;
    filter: saturate(0.94);
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .photo-card:hover img { transform: scale(1.06); filter: saturate(1.05); }

  .card-count {
    display: block;
    margin-top: 0.4rem;
    text-align: right;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    color: #5B5752;
  }

  /* ---------- Set-size badge ---------- */
  /* The only signal, in the grid, that a card opens onto more than one
     photo — inside .photo-frame (not the card) so it's pinned to the
     visible image regardless of the frame's own aspect ratio. */
  .set-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: rgba(27, 24, 21, 0.55);
    backdrop-filter: blur(2px);
    color: #F6F2E8;
    font-size: 0.6rem;
    letter-spacing: 0.02em;
    line-height: 18px;
    text-align: center;
  }

  /* ---------- Category dot ---------- */
  .dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; }

  /* ---------- Lightbox ---------- */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 9997;
    background: rgba(27,24,21,0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s var(--ease-spring);
    backdrop-filter: blur(6px);
  }
  #lightbox.open { opacity: 1; pointer-events: auto; }
  #lightbox img {
    max-width: min(86vw, 1000px);
    max-height: 78vh;
    object-fit: contain;
    box-shadow: 0 30px 80px -20px rgba(27,24,21,0.7);
    opacity: 0;
    transform: scale(0.97);
    transition: opacity 0.45s var(--ease-spring), transform 0.45s var(--ease-spring);
  }
  #lightbox.open img { opacity: 1; transform: scale(1); }
  .lb-btn {
    transition: transform 0.3s var(--ease-spring), opacity 0.3s ease, border-color 0.3s ease;
  }
  .lb-btn:hover { transform: scale(1.08); border-color: rgba(246,242,232,0.6); }
  .lb-btn:active { transform: scale(0.94); }
  /* Cream, not ink — this one sits on the dark lightbox backdrop. */
  .lb-btn:focus-visible { outline: 2px solid #F6F2E8; outline-offset: 2px; }

  /* ---------- Mobile nav overlay ---------- */
  #mobile-nav {
    position: fixed; inset: 0; z-index: 9996;
    background: #F6F2E8;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s var(--ease-spring);
  }
  #mobile-nav.open { opacity: 1; pointer-events: auto; }
  #mobile-nav a {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s var(--ease-spring), transform 0.5s var(--ease-spring);
  }
  #mobile-nav.open a { opacity: 1; transform: translateY(0); }
  #mobile-nav a:nth-of-type(1) { transition-delay: 0.05s; }
  #mobile-nav a:nth-of-type(2) { transition-delay: 0.1s; }
  #mobile-nav a:nth-of-type(3) { transition-delay: 0.15s; }
  #mobile-nav a:nth-of-type(4) { transition-delay: 0.2s; }

  ::selection { background: #1B1815; color: #F6F2E8; }

  /* Baseline focus ring in ink. Without it the UA default paints a blue one —
     the one colour on the site that isn't ink or cream. Elements with their
     own focus treatment (pills, lightbox buttons, nav underline) override it. */
  a:focus-visible,
  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid #1B1815;
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ---------- Custom ring cursor ---------- */
  /* Only enabled for fine pointers; !important because plenty of elements set
     their own cursor (grab, pointer, ...) that would otherwise win. */
  .custom-cursor, .custom-cursor * { cursor: none !important; }

  #cursor-ring {
    position: fixed;
    top: 0; left: 0;
    z-index: 10001;
    pointer-events: none;
    will-change: transform;
    /* Blend lives on this element, not the inner span: a child's mix-blend-mode
       is confined to its parent's stacking context, and the z-index here makes
       one — so blending inside would composite against nothing. Inverting
       against the backdrop keeps the ring legible on the cream field and on
       the dark lightbox alike. */
    mix-blend-mode: difference;
  }
  /* Inner element carries the look, so JS can own the outer transform
     (position) without the two fighting over the same property. */
  #cursor-ring span {
    display: block;
    width: 34px; height: 34px;
    margin: -17px 0 0 -17px;
    border: 1.5px solid #fff;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0);
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.35s var(--ease-spring),
                transform 0.35s var(--ease-spring),
                background-color 0.35s var(--ease-spring);
  }
  #cursor-ring.is-visible span { opacity: 1; transform: scale(1); }
  /* Over anything clickable the outline floods solid — read through the
     difference blend, that inverts whatever sits under it, so the filled disc
     stays legible on the cream field and on a dark photo alike. */
  #cursor-ring.over-target span { background: rgba(255, 255, 255, 1); }

  /* Inside the lightbox the ring gives way to a label, since scrolling — not
     clicking — is how you move through the set. Same outer element, same
     position/easing already driven by JS; only which child is visible swaps. */
  #cursor-ring .scroll-hint {
    position: absolute;
    top: 0; left: 0;
    width: max-content;
    margin: -10px 0 0 18px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #fff;
    white-space: nowrap;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.35s var(--ease-spring), transform 0.35s var(--ease-spring);
  }
  #cursor-ring.lightbox-mode span { opacity: 0; transform: scale(0.4); }
  #cursor-ring.lightbox-mode.is-visible .scroll-hint { opacity: 1; transform: scale(1); }

  /* ---------- Views (home vs. individual galleries) ---------- */
  /* Only hide inactive views — leave "active" display untouched so each
     view's own utility classes (block, flex, ...) decide its layout. */
  .view:not(.active) { display: none; }

  /* ---------- Page transition: "through the letters" ---------- */
  #transition-overlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #F6F2E8;
    pointer-events: none;
    opacity: 0;
    transform: scale(1);
  }
  #transition-overlay.animating {
    transition: opacity 1.05s cubic-bezier(0.76, 0, 0.24, 1),
      transform 1.05s cubic-bezier(0.76, 0, 0.24, 1);
  }
  /* Gallery-to-gallery uses this plain cream flash instead of the wordmark
     tunnel — there's no hero on screen to zoom through, and the scale/tunnel
     motion only makes sense relative to it. The wordmark clone still lives
     inside the overlay regardless, so it has to be hidden explicitly here or
     it would flash into view along with the fade. */
  #transition-overlay.plain-swap .hero-badge { visibility: hidden; }

  /* ---------- Circular wordmark badge ---------- */
  /* One shared class sizes both the hero's live badge and its overlay twin
     identically and automatically — no second set of breakpoints to keep in
     sync by hand. "LIBBY" curves along the top arc, "LI" along the bottom,
     the way a photographer's embossing stamp or a lens ring sets curved
     text — a small, quiet insignia rather than the sprawling flat wordmark
     this replaces. */
  .hero-badge {
    display: block;
    width: clamp(130px, 20vw, 200px);
    height: clamp(130px, 20vw, 200px);
    overflow: visible;
  }
  .badge-ring {
    fill: none;
    stroke: #1B1815;
    stroke-width: 1;
    opacity: 0.55;
  }
  .badge-dot { fill: #1B1815; opacity: 0.55; }
  .badge-text {
    font-family: "EB Garamond", Garamond, Georgia, serif;
    font-size: 27px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    fill: #1B1815;
  }
  .badge-text-italic { font-style: italic; font-weight: 400; }

  /* ---------- Hero orbit ---------- */
  /* The hero's centerpiece: recent photos revolve slowly around the badge.
     Sits below the hero copy (z-10 there vs. z-0 here) and clipped by #top's
     own overflow-hidden, so the ring can never push a card past the edge. */
  .hero-orbit {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .orbit-card {
    position: absolute;
    left: 50%;
    top: 50%;
    width: clamp(70px, 9vw, 130px);
    margin: 0;
    padding: 0;
    border: none;
    background: none;
    display: block;
    pointer-events: auto;
    cursor: pointer;
    /* Angle/radius place it on the ring; the counter-rotate keeps the card
       itself upright regardless of where it sits. All three custom
       properties are rewritten every frame from JS — a CSS transition here
       would fight that per-frame update instead of smoothing it, the same
       reason the cursor ring and gallery scatter both skip one too. */
    transform: translate(-50%, -50%) rotate(var(--orbit-angle, 0deg))
      translate(var(--orbit-radius, 200px)) rotate(calc(-1 * var(--orbit-angle, 0deg)))
      scale(var(--orbit-scale, 1));
  }
  .orbit-card .photo-frame {
    box-shadow: 0 1px 2px rgba(27,24,21,0.05), 0 18px 34px -20px rgba(27,24,21,0.4);
  }
  .orbit-card:focus-visible {
    outline: 2px solid #1B1815;
    outline-offset: 3px;
    border-radius: 4px;
  }
  .orbit-card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.92);
  }
  @media (max-width: 640px) {
    .orbit-card { width: clamp(58px, 15vw, 92px); }
  }

  /* ---------- Orbit flight + enlarged view ---------- */
  /* The clone that "blows" from a card's ring position to screen centre —
     positioned in JS every frame along a randomised curve, so only left/top/
     width/height/transform are ever touched here, never a CSS animation. */
  .orbit-flight-card {
    position: fixed;
    z-index: 10000;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(27,24,21,0.12), 0 32px 60px -20px rgba(27,24,21,0.5);
    pointer-events: none;
  }
  .orbit-flight-card img { display: block; width: 100%; height: 100%; object-fit: cover; }

  /* Where the card settles: a plain, single-photo view — deliberately
     simpler than the full lightbox (no scrolling through a set), since the
     point of this one is the arrival, not browsing. */
  #orbit-view {
    position: fixed;
    inset: 0;
    /* Above the header (9999) — its box spans the full width even where it
       has no visible content, and would otherwise silently steal clicks
       meant for the close button in that top-right corner. Below the
       cursor ring (10001), same as the letters-transition overlay. */
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(246, 242, 232, 0.97);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s var(--ease-spring);
  }
  #orbit-view.is-open {
    opacity: 1;
    visibility: visible;
  }
  #orbit-view .photo-frame,
  .orbit-view-frame {
    position: relative;
    max-width: 72vw;
    max-height: 78vh;
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 8px 20px rgba(27,24,21,0.12), 0 40px 70px -24px rgba(27,24,21,0.5);
  }
  #orbit-view img {
    display: block;
    max-width: 72vw;
    max-height: 78vh;
    object-fit: contain;
  }
  .orbit-view-count {
    position: absolute;
    bottom: 12px;
    right: 14px;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(27,24,21,0.72);
    color: #F6F2E8;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
  }
  #orbit-view-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    width: 2.5rem;
    height: 2.5rem;
    border-radius: 999px;
    border: 1px solid rgba(27,24,21,0.2);
    background: #F6F2E8;
    color: #1B1815;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  #orbit-view-close:hover { border-color: rgba(27,24,21,0.42); }
  #orbit-view-close:focus-visible { outline: 2px solid #1B1815; outline-offset: 2px; }
</style>

<body class="font-body text-ink bg-cream">

  <!-- Shared geometry for the circular wordmark badge below — one pair of
       arcs, referenced by both the hero's live badge and its transition-
       overlay twin, so their curves can never drift out of sync. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <path id="badge-arc-top" d="M 24.66,79.81 A 78,78 0 0 1 175.34,79.81" />
      <path id="badge-arc-bottom" d="M 24.66,120.19 A 78,78 0 0 0 175.34,120.19" />
    </defs>
  </svg>


  <div class="grain"></div>
  <div class="rule-top"></div>
  <div class="rule-bottom"></div>

  <!-- ================= CUSTOM CURSOR ================= -->
  <div id="cursor-ring" aria-hidden="true">
    <span></span>
    <span class="scroll-hint">Scroll to discover</span>
  </div>

  <!-- ================= PAGE TRANSITION OVERLAY ================= -->
  <div id="transition-overlay" aria-hidden="true">
    <svg class="hero-badge" viewBox="0 0 200 200">
      <circle class="badge-ring" cx="100" cy="100" r="92" />
      <circle class="badge-dot" cx="22" cy="100" r="2.4" />
      <circle class="badge-dot" cx="178" cy="100" r="2.4" />
      <text class="badge-text">
        <textPath href="#badge-arc-top" startOffset="50%" text-anchor="middle">Libby</textPath>
      </text>
      <text class="badge-text badge-text-italic">
        <textPath href="#badge-arc-bottom" startOffset="50%" text-anchor="middle">Li</textPath>
      </text>
    </svg>
  </div>

  <!-- ================= ORBIT ENLARGED VIEW ================= -->
  <!-- A clicked orbit card "blows" here (see openOrbitView) and settles into
       a plain single-photo view — deliberately simpler than the scrollable
       lightbox used everywhere else, since the point is the arrival. -->
  <div id="orbit-view" aria-hidden="true">

  <!-- Regenerated by `node build-photos.mjs` — see that file and photos/README.md.
       Defines window.REAL_PHOTOS; empty ({}) until you've dropped photos in
       and run the script at least once. -->
  <script src="photos-data.js"></script>
  <script>
    // ---------------- Data ----------------
    // Aspect ratios for the placeholder set — swap this whole block for real
    // photo entries ({ w, h, src }) when the actual images are ready.
    const ASPECTS = [
      [800, 1000], [1000, 700], [700, 700], [700, 950], [1000, 650], [750, 1000],
      [900, 600], [650, 850], [1000, 1000], [900, 1200], [1200, 800], [800, 800],
      [640, 900], [1100, 700], [700, 1050], [950, 640], [880, 1100], [1000, 750],
      [720, 720], [1150, 760], [760, 1000], [1000, 620], [860, 860], [680, 900],
      [1050, 700], [820, 1080],
    ];

    // `shapeOffset` rotates which aspect ratio lands in each scatter slot, so
    // the three galleries differ in silhouette as well as position.
    const CATEGORY_META = {
      // Placeholder swatches, three steps along the same ink -> cream line, so
      // the galleries still read apart without introducing a hue.
      travel:   { label: "Travel",      short: "Travel",   bg: "1B1815", fg: "F6F2E8", shapeOffset: 0 },
      personal: { label: "Personal",    short: "Personal", bg: "3C3935", fg: "F6F2E8", shapeOffset: 9 },
      bruin:    { label: "Daily Bruin", short: "Bruin",    bg: "5D5954", fg: "F6F2E8", shapeOffset: 17 },
    };

    // Seeded PRNG (mulberry32) — the scatter is randomised per gallery but
    // stays identical across reloads and navigation, so the layout never
    // reshuffles under the visitor mid-visit. Declared as a function (hoisted)
    // so `categories` below can call it despite being defined first on the page.
    function makeRng(seed) {
      let t = seed >>> 0;
      return function () {
        t += 0x6d2b79f5;
        let x = t;
        x = Math.imul(x ^ (x >>> 15), x | 1);
        x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
        return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
      };
    }
    function seedFrom(str) {
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619);
      }
      return h >>> 0;
    }
    const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

    // Salted into every scatter/slot-assignment seed below. Previously those
    // seeds came from fixed strings alone, so the layout was randomised but
    // identical on every reload — now this re-rolls once per page load, so
    // refreshing reshuffles where every card lands (still stable for the
    // rest of that one visit, since it's read once here, not re-rolled per use).
    const LAYOUT_SEED = (Math.random() * 4294967296) >>> 0;

    // Fisher-Yates, driven by the passed-in seeded rng so it stays part of
    // the same reproducible-per-load sequence as everything else here.
    function shuffled(arr, rng) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // Each scattered card is its own small gallery — a set of related shots,
    // not a single photo. Set size varies per card (2–6), seeded so it's
    // stable across reloads like everything else here. The card's own w/h/t
    // double as its first set photo, so the thumbnail is just "the top of
    // the stack" rather than a separate, unrelated cover image.
    // Some cards land on 1 — a single photo, same as before this feature —
    // so the badge (and the ability to scroll at all) only shows up where
    // there's actually something to scroll through.
    const SET_SIZE_MIN = 1;
    const SET_SIZE_MAX = 6;

    // Real photos, dropped in photos/<category>/ and picked up by
    // `node build-photos.mjs` into photos-data.js (see that file's own
    // comments). A category with none yet just falls through to the
    // placeholder generator below — swap categories over one at a time,
    // nothing here requires doing it all at once.
    // Everything from here on used to run synchronously the instant this
    // script parsed. It's now wrapped in one async function so live photos
    // from the upload API (Phase 5) can be merged in before the single
    // rendering pass runs — the scatter/scaling math below (scaleFor,
    // layoutSlot, trackWidthFor) all depend on each category's *final*
    // image count, so it has to see the merged total, not render once for
    // local photos and again later for live ones.
    (async function boot() {
      async function fetchWithTimeout(url, ms) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), ms);
        try {
          return await fetch(url, { signal: controller.signal });
        } finally {
          clearTimeout(timer);
        }
      }

      // Live-uploaded photos (Phase 5's admin page + upload API) merge in
      // alongside the folder-based ones from photos-data.js — both produce
      // the same {sets:[{w,h,t,src,clip}]} card shape, so nothing past this
      // point can tell which source a given card came from. The VM being
      // slow, down, or a category having nothing uploaded yet all just
      // leave that category exactly as photos-data.js already left it.
      const API_BASE = "https://upload.libbyli.me";
      const REAL_PHOTOS = { ...(window.REAL_PHOTOS || {}) };
      await Promise.all(
        Object.keys(CATEGORY_META).map(async (key) => {
          try {
            const res = await fetchWithTimeout(`${API_BASE}/api/photos?category=${key}`, 4000);
            if (!res.ok) return;
            const cards = await res.json();
            if (!cards.length) return;
            const liveCards = cards.map((card) => ({
              sets: card.photos.map((p) => ({
                w: p.width,
                h: p.height,
                t: card.title,
                src: `${API_BASE}/uploads/${p.filename}`,
                clip: false,
              })),
            }));
            REAL_PHOTOS[key] = [...(REAL_PHOTOS[key] || []), ...liveCards];
          } catch {
            // Offline, timed out, or the API errored — fall back silently.
          }
        })
      );

    const categories = Object.fromEntries(
      Object.entries(CATEGORY_META).map(([key, meta]) => {
        const real = REAL_PHOTOS[key];
        if (real && real.length) {
          // Each entry is already one card's full set — build-photos.mjs
          // put a loose file in as a set of one and a subfolder in as a
          // set of however many images it held. The cover (what the grid
          // shows) is just that set's first photo.
          const images = real.map((card) => {
            const cover = card.sets[0];
            return { w: cover.w, h: cover.h, t: cover.t, src: cover.src, clip: false, sets: card.sets };
          });
          return [key, { ...meta, images }];
        }
        const images = ASPECTS.map((_, i) => {
          const [w, h] = ASPECTS[(i + meta.shapeOffset) % ASPECTS.length];
          const t = `${meta.short} ${String(i + 1).padStart(2, "0")}`;
          const setRng = makeRng(seedFrom(`${key}-${i}-set`));
          const setSize = SET_SIZE_MIN + Math.floor(setRng() * (SET_SIZE_MAX - SET_SIZE_MIN + 1));
          const sets = Array.from({ length: setSize }, (_, si) => {
            const [sw, sh] = ASPECTS[(i + meta.shapeOffset + si * 7) % ASPECTS.length];
            return { w: sw, h: sh, t, clip: key === "bruin" && i === 1 && si === 0 };
          });
          return { w, h, t, clip: key === "bruin" && i === 1, sets };
        });
        return [key, { ...meta, images }];
      })
    );

    // Locally-generated SVG placeholders — no external service, no network
    // flakiness, instant paint. A category with real photos in photos-data.js
    // (see build-photos.mjs) skips all of this — item.src just points at the
    // real file. Once every category has real photos, this whole function,
    // and the ASPECTS placeholder set above, can go.
    function imgUrl(cat, item) {
      if (item.src) return item.src;
      const bg = item.clip ? "EBE7DD" : cat.bg;
      const fg = item.clip ? "1B1815" : cat.fg;
      const lines = item.clip ? ["DAILY BRUIN", "ARCHIVE SCAN"] : [item.t];
      const fontSize = Math.round(item.w * 0.062);
      const lineHeight = fontSize * 1.4;
      const startY = item.h / 2 - ((lines.length - 1) * lineHeight) / 2;
      const tspans = lines
        .map((l, i) => `<tspan x="50%" y="${startY + i * lineHeight}">${l}</tspan>`)
        .join("");
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${item.w}" height="${item.h}" viewBox="0 0 ${item.w} ${item.h}"><rect width="100%" height="100%" fill="#${bg}"/><text font-family="IBM Plex Mono, monospace" font-size="${fontSize}" letter-spacing="1" fill="#${fg}" text-anchor="middle">${tspans}</text></svg>`;
      return `data:image/svg+xml,${encodeURIComponent(svg)}`;
    }

    // ---------------- Render grids ----------------
    const gridEls = {
      travel: document.getElementById("grid-travel"),
      personal: document.getElementById("grid-personal"),
      bruin: document.getElementById("grid-bruin"),
    };

    // Hand-tuned scatter field: [x% of track width, y% of viewport height, size].
    // Neighbouring x positions get widely separated y values so photos read as
    // freely scattered without colliding, and the big frames are kept high
    // enough that their full height still clears the bottom edge.
    const LAYOUT = [
      [1, 26, "m"],  [4, 58, "s"],  [8, 7, "l"],   [12, 40, "s"], [15, 70, "s"],
      [19, 20, "l"], [23, 50, "m"], [26, 7, "s"],  [30, 32, "l"], [34, 68, "m"],
      [38, 14, "m"], [41, 44, "s"], [45, 78, "m"], [49, 8, "m"],  [53, 36, "l"],
      [57, 66, "s"], [61, 18, "s"], [64, 46, "l"], [68, 79, "m"], [72, 7, "m"],
      [76, 30, "s"], [80, 56, "m"], [85, 12, "l"], [89, 42, "s"], [93, 76, "s"],
      [96, 22, "m"],
    ];

    // Base s/m/l sizes, tuned for a full 26-card placeholder gallery. A
    // category with far fewer real photos scales these up — see scaleFor()
    // below — so a couple of photos still cover a real fraction of the page
    // instead of sitting small in the one scatter slot they happened to land on.
    const SIZE_BASE = {
      s: { min: 64, vw: 6.5, max: 104 },
      m: { min: 84, vw: 9, max: 142 },
      l: { min: 104, vw: 11.5, max: 184 },
    };
    function sizeWidthFor(size, scale) {
      const b = SIZE_BASE[size];
      return `clamp(${Math.round(b.min * scale)}px, ${(b.vw * scale).toFixed(2)}vw, ${Math.round(b.max * scale)}px)`;
    }
    // Area (not width) is what should roughly track 1/count, so width scales
    // by its square root — capped so a single photo doesn't balloon into
    // something ungainly. At the full 26 cards this is exactly 1 (no change).
    function scaleFor(count) {
      return clamp(Math.sqrt(LAYOUT.length / Math.max(count, 1)), 1, 2.2);
    }
    // LAYOUT's x-values already run roughly left-to-right in array order —
    // with a full 26 cards that's incidental, but it means sampling `count`
    // evenly-spaced indices out of it (instead of just the first `count`)
    // spreads a handful of cards across the whole width instead of bunching
    // them in whatever corner the array happens to start in.
    function layoutSlot(count, i) {
      if (count >= LAYOUT.length) return LAYOUT[i % LAYOUT.length];
      const idx = Math.round(i * (LAYOUT.length - 1) / Math.max(count - 1, 1));
      return LAYOUT[idx];
    }
    // Bigger cards alone don't fix the empty feeling if they're still
    // scattered across a track sized for 26 of them — 2 large photos on a
    // 170vw track just means a long empty scroll between them. The track
    // shrinks toward MIN_TRACK_VW as card count (and card size) drops, and
    // is exactly the original width at a full 26 cards.
    const MOBILE_TRACK = window.matchMedia("(max-width: 860px)").matches;
    const BASE_TRACK_VW = MOBILE_TRACK ? 430 : 170;
    const MIN_TRACK_VW = MOBILE_TRACK ? 160 : 110; // still > 100vw, so there's always a little real scroll
    function trackWidthFor(count, scale) {
      const density = clamp((count * scale) / LAYOUT.length, 0, 1);
      return `${Math.round(MIN_TRACK_VW + (BASE_TRACK_VW - MIN_TRACK_VW) * density)}vw`;
    }

    Object.entries(categories).forEach(([key, cat]) => {
      const grid = gridEls[key];
      const rng = makeRng(seedFrom(key) ^ LAYOUT_SEED);
      const scale = scaleFor(cat.images.length);
      grid.style.width = trackWidthFor(cat.images.length, scale);
      // Which photo lands in which of the evenly-spread slots is reshuffled
      // per load — the slots themselves (and their non-colliding spacing)
      // stay exactly as hand-tuned in LAYOUT.
      const slotOrder = shuffled([...Array(cat.images.length).keys()], rng);

      cat.images.forEach((item, i) => {
        const [x, y, size] = layoutSlot(cat.images.length, slotOrder[i]);
        // Bounded jitter: enough to make each gallery read differently, small
        // enough that the hand-tuned spacing still holds.
        const jx = (rng() - 0.5) * 3; // ±1.5%
        const jy = (rng() - 0.5) * 6; // ±3%

        const card = document.createElement("div");
        card.className = "photo-card reveal";
        card.tabIndex = 0;
        card.dataset.cat = key;
        card.dataset.index = i;
        card.style.left = `${clamp(x + jx, 0.5, 97.5)}%`;
        card.dataset.top = clamp(y + jy, 6, 80);
        card.style.top = `${card.dataset.top}%`;
        card.style.width = sizeWidthFor(size, scale);
        card.style.transitionDelay = `${Math.min(i * 35, 500)}ms`;
        // The badge is the only hint a card holds more than one photo — it
        // only appears when there's something behind the cover to find.
        const setBadge = item.sets.length > 1
          ? `<span class="set-badge font-mono">${item.sets.length}</span>`
          : "";
        card.innerHTML = `
          <div class="photo-frame" style="aspect-ratio:${item.w}/${item.h}">
            <img src="${imgUrl(cat, item)}" alt="${cat.label} photograph ${i + 1}" width="${item.w}" height="${item.h}" />
            ${setBadge}
          </div>
          <span class="card-count font-mono">${String(i + 1).padStart(2, "0")} / ${String(cat.images.length).padStart(2, "0")}</span>
        `;
        grid.appendChild(card);
      });
    });

    // A gallery is exactly one screen tall and never scrolls vertically, so a
    // card hanging past the bottom edge is simply lost — its caption sliced off
    // with no way to reach it. Pull any overhang back inside. Measured from
    // layout offsets rather than bounding rects, so a reveal or magnify
    // transform in flight can't skew the reading, and always recomputed from
    // the card's original position so repeated passes don't creep upward.
    const EDGE_INSET = 18; // px of breathing room above the bottom rule
    function fitCards(track) {
      const h = track.clientHeight;
      if (!h) return; // hidden view — offsets all read as zero
      const limit = h - EDGE_INSET;
      track.querySelectorAll(".photo-card").forEach((card) => {
        card.style.top = `${card.dataset.top}%`;
        const over = card.offsetTop + card.offsetHeight - limit;
        if (over > 0) card.style.top = `${((card.offsetTop - over) / h) * 100}%`;
      });
    }
    const fitAllCards = () => Object.values(gridEls).forEach(fitCards);
    fitAllCards();
    window.addEventListener("resize", fitAllCards);

    // ---------------- Horizontal scroll interaction ----------------
    // Vertical wheel/trackpad gestures pan the strip sideways; released at
    // either edge so page scroll continues normally once a strip is exhausted.
    //
    // Wheel input feeds a target position, and a damped spring eases the real
    // scroll toward it each frame. Velocity builds from rest and decays back to
    // rest, so motion slows at both ends of the gesture instead of snapping.
    const REDUCE_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    // Critically damped: for this integrator, no-overshoot requires
    // (1 + d - d*k)^2 >= 4d. At k = 0.045 that puts the boundary at d ~= 0.681,
    // so 0.67 glides to a stop without ever springing back past the target.
    // Low stiffness keeps acceleration gentle and stretches out the glide.
    const SPRING_STIFFNESS = 0.045; // pull toward target per frame
    const SPRING_DAMPING = 0.67;    // velocity retained per frame
    const SETTLE_EPSILON = 0.25;    // px — below this the motion is imperceptible
    // Near either end, each wheel notch contributes progressively less travel,
    // so the strip drifts into the boundary instead of hitting a hard clamp.
    const EDGE_SOFT_ZONE = 420;     // px of run-in over which input is damped

    document.querySelectorAll(".gallery-viewport").forEach((vp) => {
      // `current` is the authoritative float position. Reading it back from
      // vp.scrollLeft instead would be lossy — the DOM rounds scroll offsets to
      // whole pixels, so sub-pixel steps would vanish, the distance-to-target
      // would never reach zero, and the rAF loop would spin forever.
      let current = vp.scrollLeft;
      let target = vp.scrollLeft;
      let velocity = 0;
      let rafId = null;
      const maxScroll = () => vp.scrollWidth - vp.clientWidth;
      // Exposed so activateView can force a resync once this gallery is
      // genuinely on screen — see the note on GALLERY_SCROLL_SYNC below for
      // why the "scroll" listener further down isn't enough on its own.
      vp._syncScrollSpring = () => { current = target = vp.scrollLeft; };

      function tick() {
        const dist = target - current;
        velocity = (velocity + dist * SPRING_STIFFNESS) * SPRING_DAMPING;
        if (Math.abs(dist) < SETTLE_EPSILON && Math.abs(velocity) < SETTLE_EPSILON) {
          current = target; // settle exactly, then stop burning frames
          vp.scrollLeft = target;
          velocity = 0;
          rafId = null;
          return;
        }
        current += velocity;
        vp.scrollLeft = current;
        rafId = requestAnimationFrame(tick);
      }
      function startSpring() {
        if (rafId === null) rafId = requestAnimationFrame(tick);
      }
      function stopSpring() {
        if (rafId !== null) cancelAnimationFrame(rafId);
        rafId = null;
        velocity = 0;
        current = target = vp.scrollLeft;
      }

      vp.addEventListener(
        "wheel",
        (e) => {
          const max = maxScroll();
          if (max <= 0) return;
          if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return; // native horizontal gesture, leave it alone
          const goingRight = e.deltaY > 0;
          // Compare against the target, not the live position, so the strip
          // hands scrolling back to the page only once it's truly exhausted.
          if ((goingRight && target >= max - 0.5) || (!goingRight && target <= 0.5)) return;
          e.preventDefault();
          if (REDUCE_MOTION) {
            vp.scrollLeft = clamp(vp.scrollLeft + e.deltaY, 0, max);
            current = target = vp.scrollLeft;
            return;
          }
          // Taper input as the edge approaches so arrival is a glide, not a stop.
          const remaining = e.deltaY > 0 ? max - target : target;
          const taper = remaining < EDGE_SOFT_ZONE
            ? Math.max(0.12, remaining / EDGE_SOFT_ZONE)
            : 1;
          target = clamp(target + e.deltaY * taper, 0, max);
          startSpring();
        },
        { passive: false }
      );

      // Touch scrolls natively — stand down so the spring doesn't fight momentum.
      vp.addEventListener("touchstart", stopSpring, { passive: true });
      // Keep the target in sync when the position changes by any other means.
      vp.addEventListener("scroll", () => {
        // A card can bleed a pixel past the bottom edge, which is enough for
        // focusing it to nudge the track vertically. The page holds still, so
        // pin it back — sideways is the only axis that moves.
        if (vp.scrollTop) vp.scrollTop = 0;
        if (rafId === null) current = target = vp.scrollLeft;
      }, { passive: true });

      // Click-and-drag panning for mouse users — stays 1:1 with the cursor.
      let isDown = false, dragged = false, startX = 0, startScroll = 0;
      vp.addEventListener("mousedown", (e) => {
        isDown = true; dragged = false;
        startX = e.pageX; startScroll = vp.scrollLeft;
        stopSpring();
        vp.classList.add("dragging");
      });
      window.addEventListener("mousemove", (e) => {
        if (!isDown) return;
        const dx = e.pageX - startX;
        if (Math.abs(dx) > 4) dragged = true;
        vp.scrollLeft = clamp(startScroll - dx, 0, maxScroll());
        current = target = vp.scrollLeft;
      });
      window.addEventListener("mouseup", () => {
        if (!isDown) return;
        isDown = false;
        vp.classList.remove("dragging");
        current = target = vp.scrollLeft;
      });
      // Suppress the click-to-open-lightbox when the pointer moved (was a drag, not a tap).
      vp.addEventListener(
        "click",
        (e) => { if (dragged) { e.preventDefault(); e.stopPropagation(); } },
        true
      );
    });

    // ---------------- Cursor magnifier ----------------
    // Photos swell by proximity to the pointer: whatever sits under the cursor
    // takes the full boost, neighbours taper off with distance, so the cursor
    // reads as a lens gliding over the field.
    const FINE_POINTER = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
    const MAG_RADIUS = 340;     // px of influence around the cursor
    const MAG_MAX_BOOST = 0.35; // extra scale on the photo under the cursor
    // Each photo's scale rides its own critically damped spring, so it swells
    // and relaxes with a little weight instead of snapping to the pointer.
    // Same no-overshoot rule as the scroll: (1 + d - d*k)^2 >= 4d, which at
    // k = 0.055 puts the boundary at d ~= 0.656.
    const MAG_STIFFNESS = 0.055;
    const MAG_DAMPING = 0.65;
    const MAG_EPSILON = 0.0005; // scale units below which motion is invisible

    if (FINE_POINTER && !REDUCE_MOTION) {
      document.documentElement.classList.add("magnify");

      document.querySelectorAll(".gallery-viewport").forEach((vp) => {
        const track = vp.querySelector(".gallery-track");
        const cards = [...track.querySelectorAll(".photo-card")].map((card) => ({
          card,
          frame: card.querySelector(".photo-frame"),
          cur: 1,
          vel: 0,
          box: null,
          z: "",
        }));
        if (!cards.length) return;

        let vpRect = null;
        let pointer = null; // client coords, or null when the cursor is away
        let rafId = null;

        // Measured lazily: an inactive view is display:none, where every offset
        // reads back 0, so measuring up front would cache garbage.
        function measure() {
          vpRect = vp.getBoundingClientRect();
          for (const c of cards) {
            c.box = {
              left: c.card.offsetLeft,
              top: c.card.offsetTop,
              right: c.card.offsetLeft + c.frame.offsetWidth,
              bottom: c.card.offsetTop + c.frame.offsetHeight,
            };
          }
        }

        function frame() {
          let px = null, py = null;
          if (pointer && vpRect) {
            // Cursor in track space, so magnification tracks the photos as the
            // strip scrolls beneath a stationary pointer.
            px = pointer.x - vpRect.left + vp.scrollLeft;
            py = pointer.y - vpRect.top;
          }

          let busy = false;
          for (const c of cards) {
            let tgt = 1;
            if (px !== null && c.box) {
              // Distance to the photo's nearest edge — 0 while the cursor is
              // inside it, so anything passed over gets the full boost.
              const dx = Math.max(c.box.left - px, 0, px - c.box.right);
              const dy = Math.max(c.box.top - py, 0, py - c.box.bottom);
              const d = Math.hypot(dx, dy);
              if (d < MAG_RADIUS) {
                const t = 1 - d / MAG_RADIUS;
                tgt = 1 + MAG_MAX_BOOST * t * t * (3 - 2 * t); // smoothstep falloff
              }
            }

            const dist = tgt - c.cur;
            c.vel = (c.vel + dist * MAG_STIFFNESS) * MAG_DAMPING;
            if (Math.abs(dist) < MAG_EPSILON && Math.abs(c.vel) < MAG_EPSILON) {
              c.cur = tgt;
              c.vel = 0;
            } else {
              c.cur += c.vel;
              busy = true;
            }

            c.frame.style.transform = `scale(${c.cur.toFixed(4)})`;
            // Keep the most magnified photo above its neighbours.
            const z = c.cur > 1.001 ? String(Math.round(c.cur * 100)) : "";
            if (z !== c.z) { c.card.style.zIndex = z; c.z = z; }
          }

          // Only keep animating while something is actually changing. Holding
          // the loop open merely because the pointer is inside the gallery
          // would burn a frame every 16ms on a completely still screen.
          rafId = busy ? requestAnimationFrame(frame) : null;
        }
        function start() { if (rafId === null) rafId = requestAnimationFrame(frame); }

        vp.addEventListener("pointerenter", (e) => {
          if (e.pointerType !== "mouse") return;
          measure();
          pointer = { x: e.clientX, y: e.clientY };
          start();
        });
        vp.addEventListener("pointermove", (e) => {
          if (e.pointerType !== "mouse") return;
          if (!vpRect) measure();
          pointer = { x: e.clientX, y: e.clientY };
          start();
        });
        vp.addEventListener("pointerleave", () => { pointer = null; start(); });
        // The loop stops once everything settles, so scrolling under a still
        // pointer has to wake it — otherwise magnification would freeze while
        // the photos slide past.
        vp.addEventListener("scroll", () => { if (pointer) start(); }, { passive: true });
        window.addEventListener("resize", () => {
          vpRect = null;
          if (pointer) measure();
        });

        // Establish inline transforms so the CSS hover lift can't fight these.
        for (const c of cards) c.frame.style.transform = "scale(1)";
      });
    }

    // ---------------- Hero orbit ----------------
    // The hero's centerpiece: recent photos/mini-galleries drift in a slow,
    // continuous ring around the circular wordmark badge. Hovering a card
    // enlarges it and nudges its neighbours apart to make room; clicking one
    // sends it tumbling to screen centre along a randomised path (see
    // "Orbit card flight" below) to view it large.
    const MOBILE_HERO = window.matchMedia("(max-width: 640px)").matches;
    const ORBIT_PER_CAT = MOBILE_HERO ? 3 : 4;
    const orbitLayer = document.getElementById("hero-orbit");
    const orbitCards = [];

    (function buildOrbit() {
      const rng = makeRng(seedFrom("hero-orbit") ^ LAYOUT_SEED);
      const entries = [];
      Object.entries(categories).forEach(([key, cat]) => {
        const recent = cat.images.slice(-ORBIT_PER_CAT);
        recent.forEach((item) => entries.push({ key, cat, item }));
      });
      const ordered = shuffled(entries, rng);
      const n = ordered.length;

      ordered.forEach(({ key, cat, item }, i) => {
        const el = document.createElement("button");
        el.type = "button";
        el.className = "orbit-card";
        el.setAttribute("aria-label", `View ${item.t || cat.label} photo${item.sets.length > 1 ? "s" : ""}`);
        el.dataset.baseAngle = (i / n) * 360;

        const inner = document.createElement("div");
        inner.className = "orbit-card-inner";
        inner.innerHTML = `
          <div class="photo-frame" style="aspect-ratio:${item.w}/${item.h}">
            <img src="${imgUrl(cat, item)}" alt="" />
            ${item.sets.length > 1 ? `<span class="set-badge font-mono">${item.sets.length}</span>` : ""}
          </div>
        `;
        el.appendChild(inner);
        el._item = item;
        el._cat = cat;
        orbitLayer.appendChild(el);
        orbitCards.push(el);
      });
    })();

    // One continuous rotation, plus a per-card angular displacement that
    // eases toward "pushed away from the hovered card" — both applied every
    // frame, since the constant rotation means every card's position is
    // always moving, hover or not.
    const ORBIT_PERIOD_MS = 100000; // one full revolution
    const ORBIT_RADIUS = "clamp(150px, 29vw, 320px)";
    orbitLayer.style.setProperty("--orbit-radius", ORBIT_RADIUS);
    let orbitHoverIndex = null;
    let orbitFrozen = false; // true while a card is flying to/resting at centre
    const n = orbitCards.length;
    const orbitDisplace = orbitCards.map(() => 0); // current eased degrees, one per card
    const orbitScaleState = orbitCards.map(() => 1); // current eased scale, one per card

    function orbitTick(now) {
      const spin = orbitFrozen ? orbitTick._holdSpin ?? 0 : (now / ORBIT_PERIOD_MS) * 360;
      if (!orbitFrozen) orbitTick._holdSpin = spin;

      orbitCards.forEach((el, i) => {
        // Signed circular distance to the hovered card, in ring positions —
        // 0 is the hovered card itself; sign says which side of it this
        // card sits on, so its two neighbours part in opposite directions
        // rather than both sliding the same way.
        let diff = orbitHoverIndex === null ? Infinity : i - orbitHoverIndex;
        if (diff > n / 2) diff -= n;
        if (diff < -n / 2) diff += n;
        const dist = Math.abs(diff);
        const targetPush = dist === 1 ? 26 : dist === 2 ? 11 : 0;
        const targetDisplace = Math.sign(diff) * targetPush;
        orbitDisplace[i] += (targetDisplace - orbitDisplace[i]) * 0.14;

        const isHovered = i === orbitHoverIndex;
        orbitScaleState[i] += ((isHovered ? 1.55 : 1) - orbitScaleState[i]) * 0.15;

        const angleDeg = parseFloat(el.dataset.baseAngle) + spin + orbitDisplace[i];
        el.style.setProperty("--orbit-angle", `${angleDeg.toFixed(2)}deg`);
        el.style.setProperty("--orbit-scale", orbitScaleState[i].toFixed(3));
        el.style.zIndex = isHovered ? 5 : 1;
      });
      requestAnimationFrame(orbitTick);
    }

    if (orbitCards.length) {
      if (REDUCE_MOTION) {
        // Static ring, no spin — hover/click still work, just no ambient motion.
        orbitCards.forEach((el, i) => {
          const angleDeg = (i / orbitCards.length) * 360;
          el.style.setProperty("--orbit-angle", `${angleDeg}deg`);
          el.style.setProperty("--orbit-scale", 1);
        });
      } else {
        requestAnimationFrame(orbitTick);
      }
      orbitCards.forEach((el, i) => {
        el.addEventListener("pointerenter", () => { orbitHoverIndex = i; });
        el.addEventListener("pointerleave", () => { if (orbitHoverIndex === i) orbitHoverIndex = null; });
        el.addEventListener("focus", () => { orbitHoverIndex = i; });
        el.addEventListener("blur", () => { if (orbitHoverIndex === i) orbitHoverIndex = null; });
      });
    }

    // ---------------- Orbit card flight ----------------
    // Clicking a card sends a clone of it drifting to screen centre along a
    // randomised, gently curved path — "blowing like paper" rather than
    // sliding there in a straight line — before settling into a plain,
    // single-photo enlarged view. Reduced motion skips straight to the
    // enlarged view with no flight, same convention as everywhere else here.
    const orbitView = document.getElementById("orbit-view");
    const orbitViewImg = document.getElementById("orbit-view-img");
    const orbitViewCount = document.getElementById("orbit-view-count");
    let orbitFlightCard = null;

    function cubicPoint(p0, p1, p2, p3, t) {
      const u = 1 - t;
      return u * u * u * p0 + 3 * u * u * t * p1 + 3 * u * t * t * p2 + t * t * t * p3;
    }

    function openOrbitView(card) {
      if (orbitFrozen) return;
      orbitFrozen = true;
      orbitFlightCard = card;
      const item = card._item;
      const from = card.querySelector(".photo-frame").getBoundingClientRect();

      const vw = window.innerWidth, vh = window.innerHeight;
      const maxW = Math.min(vw * 0.72, 720), maxH = Math.min(vh * 0.78, 720);
      const scale = Math.min(maxW / item.w, maxH / item.h);
      const toW = item.w * scale, toH = item.h * scale;
      const to = { left: (vw - toW) / 2, top: (vh - toH) / 2, width: toW, height: toH };

      card.style.visibility = "hidden"; // the flying clone stands in for it now
      orbitViewImg.src = imgUrl(card._cat, item);
      const multi = item.sets.length > 1;
      orbitViewCount.textContent = multi ? `1 / ${item.sets.length}` : "";
      orbitViewCount.hidden = !multi;

      if (REDUCE_MOTION) {
        orbitView.classList.add("is-open");
        return;
      }

      // A cubic bezier from origin to destination, perturbed by a random
      // midpoint and control points — a little different every time, the
      // way a dropped photo would drift rather than fly a fixed line.
      const midX = (from.left + to.left) / 2 + (Math.random() - 0.5) * 260;
      const midY = (from.top + to.top) / 2 - 80 - Math.random() * 120;
      const c1x = from.left + (midX - from.left) * 0.5 + (Math.random() - 0.5) * 140;
      const c1y = from.top + (midY - from.top) * 0.5;
      const c2x = to.left + (midX - to.left) * 0.5 + (Math.random() - 0.5) * 140;
      const c2y = to.top + (midY - to.top) * 0.5;
      const startRot = (Math.random() - 0.5) * 30;
      const wobbleRot = startRot + (Math.random() - 0.5) * 50;

      const clone = document.createElement("div");
      clone.className = "orbit-flight-card";
      clone.innerHTML = `<img src="${imgUrl(card._cat, item)}" alt="" />`;
      clone.style.left = `${from.left}px`;
      clone.style.top = `${from.top}px`;
      clone.style.width = `${from.width}px`;
      clone.style.height = `${from.height}px`;
      document.body.appendChild(clone);

      const DUR = 800;
      const t0 = performance.now();
      function step(now) {
        const t = Math.min(1, (now - t0) / DUR);
        const e = 1 - Math.pow(1 - t, 3); // ease-out cubic
        clone.style.left = `${cubicPoint(from.left, c1x, c2x, to.left, e)}px`;
        clone.style.top = `${cubicPoint(from.top, c1y, c2y, to.top, e)}px`;
        clone.style.width = `${from.width + (to.width - from.width) * e}px`;
        clone.style.height = `${from.height + (to.height - from.height) * e}px`;
        const rot = startRot + (wobbleRot - startRot) * Math.sin(e * Math.PI);
        clone.style.transform = `rotate(${(rot * (1 - e)).toFixed(2)}deg)`;
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          clone.remove();
          orbitView.classList.add("is-open");
        }
      }
      requestAnimationFrame(step);
    }

    function closeOrbitView() {
      orbitView.classList.remove("is-open");
      if (orbitFlightCard) {
        orbitFlightCard.style.visibility = "";
        orbitFlightCard = null;
      }
      orbitHoverIndex = null; // the card was hidden, not un-hovered — clear it explicitly
      orbitFrozen = false;
    }

    orbitCards.forEach((el) => el.addEventListener("click", () => openOrbitView(el)));
    document.getElementById("orbit-view-close").addEventListener("click", closeOrbitView);
    orbitView.addEventListener("click", (e) => { if (e.target === orbitView) closeOrbitView(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && orbitView.classList.contains("is-open")) closeOrbitView();
    });

    // ---------------- Ring cursor ----------------
    // Replaces the pointer with an outlined circle that trails slightly, and
    // floods solid over anything clickable.
    if (FINE_POINTER) {
      const ring = document.getElementById("cursor-ring");
      const TARGETS = ".photo-card, a, button, [role='button']";
      const CURSOR_EASE = 0.2; // plain lerp: a cursor must track closely, so no
                               // spring ease-in here — that would feel laggy.
      let tx = 0, ty = 0, cx = 0, cy = 0;
      let placed = false;
      let rafId = null;

      function draw(x, y) { ring.style.transform = `translate(${x}px, ${y}px)`; }

      function tick() {
        cx += (tx - cx) * CURSOR_EASE;
        cy += (ty - cy) * CURSOR_EASE;
        if (Math.abs(tx - cx) < 0.1 && Math.abs(ty - cy) < 0.1) {
          cx = tx; cy = ty;
          draw(cx, cy);
          rafId = null;
          return;
        }
        draw(cx, cy);
        rafId = requestAnimationFrame(tick);
      }

      document.addEventListener("pointermove", (e) => {
        if (e.pointerType !== "mouse") return;
        tx = e.clientX;
        ty = e.clientY;
        if (!placed) {
          // First sighting: drop the ring straight onto the pointer rather
          // than letting it fly in from the corner.
          placed = true;
          cx = tx; cy = ty;
          draw(cx, cy);
          ring.classList.add("is-visible");
        }
        ring.classList.toggle("over-target", !!(e.target.closest && e.target.closest(TARGETS)));
        if (REDUCE_MOTION) { cx = tx; cy = ty; draw(cx, cy); return; }
        if (rafId === null) rafId = requestAnimationFrame(tick);
      }, { passive: true });

      // Hide while the pointer is outside the window entirely.
      document.addEventListener("mouseleave", () => ring.classList.remove("is-visible"));
      document.addEventListener("mouseenter", () => { if (placed) ring.classList.add("is-visible"); });

      document.documentElement.classList.add("custom-cursor");
    }

    // ---------------- Scroll reveal ----------------
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) {
            e.target.classList.add("is-visible");
            io.unobserve(e.target);
          }
        });
      },
      { threshold: 0.12, rootMargin: "0px 0px -60px 0px" }
    );
    document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

    // Safety net: never leave content permanently hidden (slow IO, reduced motion, etc.)
    setTimeout(() => {
      document.querySelectorAll(".reveal:not(.is-visible)").forEach((el) => {
        el.classList.add("is-visible");
        io.unobserve(el);
      });
    }, 400);

    // ---------------- Mobile nav ----------------
    const mobileNav = document.getElementById("mobile-nav");
    const menuBtn = document.getElementById("menu-btn");
    const menuClose = document.getElementById("menu-close");
    function openMenu() {
      mobileNav.classList.add("open");
      menuBtn.setAttribute("aria-expanded", "true");
      menuBtn.style.visibility = "hidden";
    }
    function closeMenu() {
      mobileNav.classList.remove("open");
      menuBtn.setAttribute("aria-expanded", "false");
      menuBtn.style.visibility = "";
    }
    menuBtn.addEventListener("click", openMenu);
    menuClose.addEventListener("click", closeMenu);
    mobileNav.querySelectorAll("a").forEach((a) => a.addEventListener("click", closeMenu));

    // ---------------- Lightbox ----------------
    // Each card is its own small gallery now, not one photo in a category-wide
    // filmstrip — currentCard picks the card, currentSetIndex picks a photo
    // within just that card's set. There's no more stepping past a card's own
    // edges into the next card's set; scrolling one runs out, same as it would
    // scrolling a real filmstrip that has a start and an end.
    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lb-img");
    const lbCaption = document.getElementById("lb-caption");
    const cursorRing = document.getElementById("cursor-ring");
    let currentCat = null, currentCard = null, currentSetIndex = 0;

    function showImage() {
      const cat = categories[currentCat];
      const card = cat.images[currentCard];
      const item = card.sets[currentSetIndex];
      lbImg.src = imgUrl(cat, item);
      lbImg.alt = card.sets.length > 1
        ? `${cat.label} photograph ${currentCard + 1}, ${currentSetIndex + 1} of ${card.sets.length}`
        : `${cat.label} photograph ${currentCard + 1}`;
      lbCaption.textContent = card.sets.length > 1
        ? `${card.t} — ${currentSetIndex + 1} / ${card.sets.length}`
        : card.t;
    }
    function openLightbox(catKey, cardIndex) {
      currentCat = catKey; currentCard = cardIndex; currentSetIndex = 0;
      showImage();
      lightbox.classList.add("open");
      cursorRing.classList.add("lightbox-mode");
    }
    function closeLightbox() {
      lightbox.classList.remove("open");
      cursorRing.classList.remove("lightbox-mode");
    }
    function step(delta) {
      const card = categories[currentCat].images[currentCard];
      const next = clamp(currentSetIndex + delta, 0, card.sets.length - 1);
      if (next === currentSetIndex) return;
      currentSetIndex = next;
      showImage();
    }

    document.querySelectorAll(".photo-card").forEach((card) => {
      const open = () => openLightbox(card.dataset.cat, parseInt(card.dataset.index, 10));
      card.addEventListener("click", open);
      card.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });

    document.getElementById("lb-close").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener("keydown", (e) => {
      if (!lightbox.classList.contains("open")) return;
      if (e.key === "Escape") closeLightbox();
      // Arrow keys stand in for the removed prev/next buttons — scroll is the
      // primary way in, but keyboard-only visitors still need a way through.
      if (e.key === "ArrowLeft") step(-1);
      if (e.key === "ArrowRight") step(1);
    });

    // Scroll (wheel or trackpad) is the only way through a set once inside
    // it — collapsed to discrete steps rather than tracking deltaY 1:1, so
    // one gesture reliably moves by one photo instead of racing through the
    // set on a single fast trackpad swipe.
    const WHEEL_COOLDOWN_MS = 420;
    const WHEEL_THRESHOLD = 4; // px — filters stray near-zero deltas, not real intent
    let lastWheelStep = 0;
    lightbox.addEventListener(
      "wheel",
      (e) => {
        if (!lightbox.classList.contains("open")) return;
        e.preventDefault();
        if (Math.abs(e.deltaY) < WHEEL_THRESHOLD) return;
        const now = performance.now();
        if (now - lastWheelStep < WHEEL_COOLDOWN_MS) return;
        lastWheelStep = now;
        step(e.deltaY > 0 ? 1 : -1);
      },
      { passive: false }
    );

    // Touch has no wheel to scroll and the arrow buttons are gone, so a
    // horizontal swipe is the only way through a set on a phone — same
    // one-step-per-gesture feel as the wheel above.
    const SWIPE_THRESHOLD = 40; // px
    let touchStartX = null;
    lightbox.addEventListener("touchstart", (e) => { touchStartX = e.changedTouches[0].clientX; }, { passive: true });
    lightbox.addEventListener("touchend", (e) => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(dx) < SWIPE_THRESHOLD) return;
      step(dx < 0 ? 1 : -1); // swipe left -> next, same direction as the gallery strip itself
    }, { passive: true });

    // ---------------- View routing ----------------
    // Each view is a self-contained screen, reachable only via nav links
    // (header, hero pills, hero nav). Hash-based so links stay shareable and
    // the browser back button works.
    const GALLERY_VIEWS = ["travel", "personal", "bruin"];
    const viewEls = {
      home: document.querySelector('[data-view="home"]'),
      travel: document.querySelector('[data-view="travel"]'),
      personal: document.querySelector('[data-view="personal"]'),
      bruin: document.querySelector('[data-view="bruin"]'),
    };

    function playReveal(container) {
      const els = container.querySelectorAll(".reveal");
      els.forEach((el) => el.classList.remove("is-visible"));
      void container.offsetWidth; // force reflow so the removal registers before re-adding
      requestAnimationFrame(() => els.forEach((el) => el.classList.add("is-visible")));
    }

    function activateView(name) {
      Object.entries(viewEls).forEach(([key, el]) => el.classList.toggle("active", key === name));
      if (name !== "home") {
        // Only measurable now that the view is on screen — a display:none
        // gallery reports zero offsets.
        fitCards(viewEls[name].querySelector(".gallery-track"));
        playReveal(viewEls[name]);
        // The wheel/drag spring's own idea of the scroll position (in a
        // closure, not read from the DOM each frame) can be stale here: the
        // float-flight and gallery-crossfade code both position this strip
        // before this point, sometimes while it's still display:none for
        // measurement — and a display:none element reports scrollLeft as 0,
        // which is exactly the value a same-tick native scroll event fires
        // with while that's still true, overwriting the correct sync moments
        // earlier. This element is genuinely on screen now, so this reading
        // is trustworthy: without it, the visitor's first scroll snaps the
        // strip back toward 0 before continuing from the real position.
        viewEls[name].querySelector(".gallery-viewport")._syncScrollSpring();
      }
      document.title = name === "home"
        ? "Libby Li — Travel Photography & Photojournalism"
        : `${categories[name].label} — Libby Li`;
    }

    // "Through the letters" transition: a full-screen clone of the hero
    // wordmark rushes toward (or recedes from) the viewer while the view
    // swaps underneath, hidden behind its coverage. Entering a gallery
    // zooms the letters up and away; returning home reverses it.
    const overlay = document.getElementById("transition-overlay");
    let currentView = null;
    let isTransitioning = false;
    const TRANSITION_MS = 1050;
    const SWAP_AT_ENTER = 220; // ms — early, while the overlay still fully covers
    // Returning home plays the same motion backwards, so the view swaps at the
    // mirrored moment: as far from the end as the enter swap is from the start.
    const SWAP_AT_EXIT = TRANSITION_MS - SWAP_AT_ENTER;

    // Leaving a gallery, the wordmark shrinks back to rest and the hero is
    // revealed behind it. Showing a display:none view restarts its CSS
    // animations, so without this the hero would be caught part-way through its
    // entrance at the hand-off instead of sitting still to be matched.
    function settleHero() {
      document.querySelectorAll("#top .hero-line").forEach((el) => {
        el.style.animation = "none";
        el.style.opacity = "1";
        el.style.transform = "none";
      });
    }

    // The overlay centres its wordmark in the viewport, but the hero's sits a
    // little higher — the label above and tagline below make that stack
    // asymmetric. Left uncorrected the wordmark visibly jumps at the hand-off,
    // so measure the gap while home is on screen and shift the overlay by it.
    let heroOffset = 0;
    function measureHeroOffset() {
      const heroWord = document.querySelector("#top .hero-badge");
      const overlayWord = overlay.querySelector(".hero-badge");
      if (!heroWord || !overlayWord) return;
      const h = heroWord.getBoundingClientRect();
      if (!h.height) return; // home not rendered — keep the last good value
      const prev = overlay.style.transform;
      overlay.style.transform = "none"; // measure the overlay's untransformed position
      const o = overlayWord.getBoundingClientRect();
      overlay.style.transform = prev;
      heroOffset = Math.round(h.top - o.top);
    }

    const REVEAL_MS = 260;

    // One motion, played forwards or backwards. Entering, the wordmark rushes
    // out past the viewer (scale 1 -> 7, fading out); returning, it comes back
    // from beyond the screen and settles (scale 7 -> 1, fading in). Starting
    // the return at scale 7 rather than a small scale matters: the overlay is a
    // solid cream panel, so any start below scale 1 would show its edges
    // sweeping in as a growing rectangle.
    function runTransition(targetName, direction) {
      const entering = direction === "enter";
      isTransitioning = true;
      if (entering) measureHeroOffset(); // home is still on screen right now
      const shift = `translateY(${heroOffset}px)`;

      overlay.style.transition = "none";
      overlay.style.opacity = entering ? "1" : "0";
      overlay.style.transform = `${shift} scale(${entering ? 1 : 7})`;
      void overlay.offsetWidth; // force reflow so the reset above applies before animating

      requestAnimationFrame(() => {
        overlay.style.transition = ""; // clear the inline override so the .animating rule can apply
        overlay.classList.add("animating");
        overlay.style.opacity = entering ? "0" : "1";
        overlay.style.transform = `${shift} scale(${entering ? 7 : 1})`;
      });

      setTimeout(() => {
        activateView(targetName);
        if (!entering) settleHero();
      }, entering ? SWAP_AT_ENTER : SWAP_AT_EXIT);

      function reset() {
        overlay.classList.remove("animating");
        overlay.style.transition = "";
        overlay.style.opacity = "0";
        overlay.style.transform = "scale(1)";
        isTransitioning = false;
        routeFromHash(); // reconcile in case the hash changed again mid-transition
      }

      setTimeout(() => {
        if (entering) return reset();
        // The return ends with the overlay at rest over the hero. Cutting it
        // away would pop the label, tagline and pills into existence all at
        // once, so dissolve instead — the aligned wordmark holds still through
        // it and the rest of the page fades up around it.
        overlay.classList.remove("animating");
        overlay.style.transition = `opacity ${REVEAL_MS}ms var(--ease-spring)`;
        overlay.style.opacity = "0";
        setTimeout(reset, REVEAL_MS);
      }, TRANSITION_MS);
    }

    // Header nav stays reachable from inside a gallery too, so you can jump
    // Travel -> Personal directly. That used to skip straight to
    // activateView() with no transition at all — an instant cut that always
    // landed the new strip at scrollLeft 0, which read as snapping to the
    // far left with no warning. This plays a quick cream flash (too short
    // for the wordmark tunnel to make sense — there's no hero on screen to
    // zoom through) and, underneath it, carries over how far across the
    // previous strip you'd scrolled rather than resetting to the start.
    const CROSSFADE_MS = 420;
    function runGalleryCrossfade(fromView, targetView) {
      isTransitioning = true;
      const fromVp = viewEls[fromView].querySelector(".gallery-viewport");
      const fromMax = fromVp.scrollWidth - fromVp.clientWidth;
      const scrollRatio = fromMax > 0 ? fromVp.scrollLeft / fromMax : 0;

      overlay.classList.add("plain-swap");
      overlay.style.transition = "none";
      overlay.style.opacity = "0";
      overlay.style.transform = "scale(1)";
      void overlay.offsetWidth; // force reflow so the reset above applies before animating

      requestAnimationFrame(() => {
        overlay.style.transition = `opacity ${CROSSFADE_MS / 2}ms var(--ease-spring)`;
        overlay.style.opacity = "1";
      });

      setTimeout(() => {
        // Same trick as measureHeroOffset / the float-to-gallery flight:
        // position the incoming strip while it's still hidden behind the
        // opaque overlay, so there's nothing to see snap into place.
        activateView(targetView);
        const targetVp = viewEls[targetView].querySelector(".gallery-viewport");
        const targetGrid = viewEls[targetView].querySelector(".gallery-track");
        const targetMax = Math.max(0, targetGrid.scrollWidth - targetVp.clientWidth);
        targetVp.scrollLeft = Math.round(scrollRatio * targetMax);
        // activateView() already resynced the wheel/drag spring's closure
        // state once, but that was a step earlier than this line — before
        // this scrollLeft was set. Do it again now that it has been.
        targetVp._syncScrollSpring();

        overlay.style.transition = `opacity ${CROSSFADE_MS / 2}ms var(--ease-spring)`;
        overlay.style.opacity = "0";
        setTimeout(() => {
          overlay.classList.remove("plain-swap");
          isTransitioning = false;
          routeFromHash(); // reconcile in case the hash changed again mid-transition
        }, CROSSFADE_MS / 2);
      }, CROSSFADE_MS / 2);
    }

    function routeFromHash() {
      if (isTransitioning) return;
      // The header sits above the lightbox, so its nav stays clickable while a
      // photo is open. Dismiss the viewer on any route change, otherwise it
      // would hang over the new view still showing the old gallery's photo.
      closeLightbox();
      const hash = location.hash.slice(1);
      const targetView = GALLERY_VIEWS.includes(hash) ? hash : "home";

      if (targetView !== currentView) {
        if (currentView === null) {
          // Initial load — land directly on the right view, no animation.
          activateView(targetView);
        } else if (currentView === "home" && targetView !== "home") {
          runTransition(targetView, "enter");
        } else if (currentView !== "home" && targetView === "home") {
          runTransition("home", "exit");
        } else {
          runGalleryCrossfade(currentView, targetView);
        }
        currentView = targetView;
      }
    }


    window.addEventListener("hashchange", routeFromHash);
    routeFromHash();
    })();
  </script>
</body>

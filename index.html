<!-- Libby Li — Photography Portfolio -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Libby Li — Travel Photography & Photojournalism</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@300;400;500&display=swap"
  rel="stylesheet"
/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          // Two colours only. Everything else is a blend of the two, so the
          // whole palette sits on a single ink -> cream line with no hue of
          // its own — the tints below are that line at 5%, 78% and 71% ink.
          cream: "#F6F2E8",
          "cream-2": "#EBE7DD",
          ink: "#1B1815",
          "ink-mid": "#4B4843",
          "ink-soft": "#5B5752",
        },
        fontFamily: {
          display: ['"Fraunces"', "serif"],
          name: ['"EB Garamond"', "Garamond", "Georgia", "serif"],
          mono: ['"IBM Plex Mono"', "monospace"],
          body: ['"Work Sans"', "sans-serif"],
        },
      },
    },
  };
</script>

<style>
  :root {
    --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    --line: rgba(27, 24, 21, 0.14);
  }

  * { box-sizing: border-box; }

  /* Every view is exactly one screen. Nothing scrolls past its edges — no
     page scroll, and no rubber-band overscroll at the boundaries either. */
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: #F6F2E8;
    color: #1B1815;
  }

  /* ---------- Grain overlay ---------- */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 9998;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---------- Top / bottom rules ---------- */
  .rule-top, .rule-bottom {
    position: fixed;
    left: 0; right: 0;
    height: 2px;
    background: #1B1815;
    z-index: 9999;
  }
  .rule-top { top: 0; }
  .rule-bottom { bottom: 0; }

  /* ---------- Header ---------- */
  .site-header {
    transition: background-color 0.4s ease;
  }

  .nav-link {
    position: relative;
    padding-bottom: 3px;
  }
  .nav-link::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.4s var(--ease-spring);
  }
  .nav-link:hover::after,
  .nav-link:focus-visible::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  /* ---------- Pills ---------- */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #F6F2E8;
    transition: transform 0.35s var(--ease-spring),
      box-shadow 0.35s var(--ease-spring),
      border-color 0.35s var(--ease-spring),
      background-color 0.35s var(--ease-spring);
    box-shadow: 0 1px 2px rgba(27,24,21,0.05);
  }
  .pill:hover {
    transform: translateY(-2px);
    border-color: rgba(27,24,21,0.42);
    box-shadow: 0 1px 2px rgba(27,24,21,0.06), 0 10px 24px -10px rgba(27,24,21,0.42);
  }
  .pill:active { transform: translateY(0px) scale(0.98); }
  .pill:focus-visible {
    outline: 2px solid #1B1815;
    outline-offset: 2px;
  }

  /* ---------- Hero ---------- */
  /* Hero elements converge on one beat: everything above centre drops in from
     the top, everything below it rises from the bottom. No stagger — the
     direction does the work, so they all land together. */
  .hero-line {
    display: block;
    opacity: 0;
    animation-duration: 1s;
    animation-timing-function: var(--ease-spring);
    animation-fill-mode: forwards;
  }
  .hero-line.from-top { animation-name: heroDropIn; }
  .hero-line.from-bottom { animation-name: heroRiseIn; }
  @keyframes heroDropIn {
    from { opacity: 0; transform: translateY(-80px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes heroRiseIn {
    from { opacity: 0; transform: translateY(80px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .float-slow {
    animation: float 7s ease-in-out infinite;
  }
  .float-slow-rev {
    animation: float 8s ease-in-out infinite reverse;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  /* ---------- Photo reveal ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 0.8s var(--ease-spring), transform 0.8s var(--ease-spring);
  }
  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- Horizontal gallery (2D scatter field) ---------- */
  /* Photos are absolutely placed across a wide, full-height track so they
     fill the whole page vertically as well as horizontally — the track
     scrolls sideways. */
  .gallery-viewport {
    overflow-x: auto;
    overflow-y: hidden;
    /* The track is the only thing that moves; hitting either end stops dead
       rather than bouncing the page or triggering a back-swipe. */
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    cursor: grab;
    height: 100dvh;
  }
  .gallery-viewport::-webkit-scrollbar { display: none; }
  .gallery-viewport.dragging { cursor: grabbing; }

  .gallery-track {
    position: relative;
    height: 100%;
    width: 170vw;
  }
  @media (max-width: 860px) { .gallery-track { width: 430vw; } }

  .photo-card {
    position: absolute;
    cursor: pointer;
  }

  .scroll-cue {
    position: absolute;
    left: 12%;
    top: 84%;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }

  .back-pill {
    position: fixed;
    bottom: 1.75rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
  }
  /* Keep the centered pill's hover/active lift from cancelling the centering. */
  .back-pill:hover { transform: translateX(-50%) translateY(-2px); }
  .back-pill:active { transform: translateX(-50%) scale(0.98); }

  .photo-frame {
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    background: #EBE7DD;
    box-shadow: 0 1px 2px rgba(27,24,21,0.06), 0 14px 30px -18px rgba(27,24,21,0.35);
    transition: transform 0.55s var(--ease-spring), box-shadow 0.55s var(--ease-spring);
  }
  .photo-card:hover .photo-frame, .photo-card:focus-visible .photo-frame {
    transform: translateY(-6px);
    box-shadow: 0 4px 10px rgba(27,24,21,0.08), 0 28px 50px -20px rgba(27,24,21,0.45);
  }
  /* With the cursor magnifier running, scale is driven per-frame from JS.
     Drop the transition so it doesn't lag the pointer, and drop the inner
     image zoom so the photo doesn't get scaled twice. */
  .magnify .photo-frame { transition: box-shadow 0.55s var(--ease-spring); }
  .magnify .photo-card:hover img { transform: none; }
  .photo-card img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.7s var(--ease-spring), filter 0.5s ease;
    filter: saturate(0.94);
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .photo-card:hover img { transform: scale(1.06); filter: saturate(1.05); }

  .card-count {
    display: block;
    margin-top: 0.4rem;
    text-align: right;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    color: #5B5752;
  }

  /* ---------- Set-size badge ---------- */
  /* The only signal, in the grid, that a card opens onto more than one
     photo — inside .photo-frame (not the card) so it's pinned to the
     visible image regardless of the frame's own aspect ratio. */
  .set-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: rgba(27, 24, 21, 0.55);
    backdrop-filter: blur(2px);
    color: #F6F2E8;
    font-size: 0.6rem;
    letter-spacing: 0.02em;
    line-height: 18px;
    text-align: center;
  }

  /* ---------- Category dot ---------- */
  .dot { width: 7px; height: 7px; border-radius: 999px; display: inline-block; }

  /* ---------- Lightbox ---------- */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 9997;
    background: rgba(27,24,21,0.94);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s var(--ease-spring);
    backdrop-filter: blur(6px);
  }
  #lightbox.open { opacity: 1; pointer-events: auto; }
  #lightbox img {
    max-width: min(86vw, 1000px);
    max-height: 78vh;
    object-fit: contain;
    box-shadow: 0 30px 80px -20px rgba(27,24,21,0.7);
    opacity: 0;
    transform: scale(0.97);
    transition: opacity 0.45s var(--ease-spring), transform 0.45s var(--ease-spring);
  }
  #lightbox.open img { opacity: 1; transform: scale(1); }
  .lb-btn {
    transition: transform 0.3s var(--ease-spring), opacity 0.3s ease, border-color 0.3s ease;
  }
  .lb-btn:hover { transform: scale(1.08); border-color: rgba(246,242,232,0.6); }
  .lb-btn:active { transform: scale(0.94); }
  /* Cream, not ink — this one sits on the dark lightbox backdrop. */
  .lb-btn:focus-visible { outline: 2px solid #F6F2E8; outline-offset: 2px; }

  /* ---------- Mobile nav overlay ---------- */
  #mobile-nav {
    position: fixed; inset: 0; z-index: 9996;
    background: #F6F2E8;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s var(--ease-spring);
  }
  #mobile-nav.open { opacity: 1; pointer-events: auto; }
  #mobile-nav a {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s var(--ease-spring), transform 0.5s var(--ease-spring);
  }
  #mobile-nav.open a { opacity: 1; transform: translateY(0); }
  #mobile-nav a:nth-of-type(1) { transition-delay: 0.05s; }
  #mobile-nav a:nth-of-type(2) { transition-delay: 0.1s; }
  #mobile-nav a:nth-of-type(3) { transition-delay: 0.15s; }
  #mobile-nav a:nth-of-type(4) { transition-delay: 0.2s; }

  ::selection { background: #1B1815; color: #F6F2E8; }

  /* Baseline focus ring in ink. Without it the UA default paints a blue one —
     the one colour on the site that isn't ink or cream. Elements with their
     own focus treatment (pills, lightbox buttons, nav underline) override it. */
  a:focus-visible,
  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid #1B1815;
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ---------- Custom ring cursor ---------- */
  /* Only enabled for fine pointers; !important because plenty of elements set
     their own cursor (grab, pointer, ...) that would otherwise win. */
  .custom-cursor, .custom-cursor * { cursor: none !important; }

  #cursor-ring {
    position: fixed;
    top: 0; left: 0;
    z-index: 10001;
    pointer-events: none;
    will-change: transform;
    /* Blend lives on this element, not the inner span: a child's mix-blend-mode
       is confined to its parent's stacking context, and the z-index here makes
       one — so blending inside would composite against nothing. Inverting
       against the backdrop keeps the ring legible on the cream field and on
       the dark lightbox alike. */
    mix-blend-mode: difference;
  }
  /* Inner element carries the look, so JS can own the outer transform
     (position) without the two fighting over the same property. */
  #cursor-ring span {
    display: block;
    width: 34px; height: 34px;
    margin: -17px 0 0 -17px;
    border: 1.5px solid #fff;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0);
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.35s var(--ease-spring),
                transform 0.35s var(--ease-spring),
                background-color 0.35s var(--ease-spring);
  }
  #cursor-ring.is-visible span { opacity: 1; transform: scale(1); }
  /* Over anything clickable the outline floods solid — read through the
     difference blend, that inverts whatever sits under it, so the filled disc
     stays legible on the cream field and on a dark photo alike. */
  #cursor-ring.over-target span { background: rgba(255, 255, 255, 1); }

  /* Inside the lightbox the ring gives way to a label, since scrolling — not
     clicking — is how you move through the set. Same outer element, same
     position/easing already driven by JS; only which child is visible swaps. */
  #cursor-ring .scroll-hint {
    position: absolute;
    top: 0; left: 0;
    width: max-content;
    margin: -10px 0 0 18px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #fff;
    white-space: nowrap;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.35s var(--ease-spring), transform 0.35s var(--ease-spring);
  }
  #cursor-ring.lightbox-mode span { opacity: 0; transform: scale(0.4); }
  #cursor-ring.lightbox-mode.is-visible .scroll-hint { opacity: 1; transform: scale(1); }

  /* ---------- Views (home vs. individual galleries) ---------- */
  /* Only hide inactive views — leave "active" display untouched so each
     view's own utility classes (block, flex, ...) decide its layout. */
  .view:not(.active) { display: none; }

  /* ---------- Page transition: "through the letters" ---------- */
  #transition-overlay {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #F6F2E8;
    pointer-events: none;
    opacity: 0;
    transform: scale(1);
  }
  #transition-overlay.animating {
    transition: opacity 1.05s cubic-bezier(0.76, 0, 0.24, 1),
      transform 1.05s cubic-bezier(0.76, 0, 0.24, 1);
  }
  /* Gallery-to-gallery uses this plain cream flash instead of the wordmark
     tunnel — there's no hero on screen to zoom through, and the scale/tunnel
     motion only makes sense relative to it. The wordmark clone still lives
     inside the overlay regardless, so it has to be hidden explicitly here or
     it would flash into view along with the fade. */
  #transition-overlay.plain-swap .to-line { visibility: hidden; }
  /* Sizing mirrors the hero wordmark exactly — same steps as its Tailwind
     classes (base 16vw, sm 9rem, md 11rem, lg 12.5rem). A clamp() here looked
     equivalent but drifted between breakpoints, so the letters changed size at
     the hand-off when the overlay settles onto the real hero. */
  #transition-overlay .to-line {
    display: block;
    /* Full-width centred text, matching how the hero centres its wordmark.
       Shrink-to-fit flex centring lands a few px off, because the negative
       letter-spacing leaves trailing space inside the box. */
    width: 100%;
    text-align: center;
    /* Must stay identical to the hero's font-name stack — the overlay settles
       onto the real wordmark at the hand-off, so any metric difference shows
       up as the letters jumping. */
    font-family: "EB Garamond", Garamond, Georgia, serif;
    font-size: 16vw;
    line-height: 0.86;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    font-weight: 500;
    color: #1B1815;
  }
  #transition-overlay .to-line.to-italic {
    font-style: italic;
    font-weight: 400;
    /* Colour inherited from .to-line — both rows are ink, like the hero's. */
    /* em, so the two cap rows keep the same optical gap at every size —
       matches the hero's -mt-[0.115em]. */
    margin-top: -0.115em;
  }
  @media (min-width: 640px) {
    #transition-overlay .to-line { font-size: 9rem; }
  }
  @media (min-width: 768px) { #transition-overlay .to-line { font-size: 11rem; } }
  @media (min-width: 1024px) { #transition-overlay .to-line { font-size: 12.5rem; } }

  /* ---------- Hero float layer ---------- */
  /* Recent photos drifting behind the wordmark. Sits below the hero copy
     (z-10 there vs. z-0 here) and clipped by #top's own overflow-hidden, so
     drift and parallax can never push a card past the viewport edge. */
  .hero-float-layer {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .float-card {
    position: absolute;
    display: block;
    width: clamp(64px, 7.5vw, 132px);
    will-change: transform;
    /* JS drives this directly each frame, like the cursor ring — a CSS
       transition here would fight the per-frame lerp instead of smoothing it.
       Hover/active feedback below lives on the .photo-frame child instead,
       so it has its own transform to animate without a collision. */
    pointer-events: auto;
    cursor: pointer;
    text-decoration: none;
  }
  .float-card .photo-frame {
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(27,24,21,0.05), 0 18px 34px -20px rgba(27,24,21,0.4);
    transition: transform 0.4s var(--ease-spring), box-shadow 0.4s var(--ease-spring);
  }
  .float-card:hover .photo-frame {
    transform: scale(1.045);
    box-shadow: 0 4px 10px rgba(27,24,21,0.1), 0 26px 46px -20px rgba(27,24,21,0.5);
  }
  .float-card:active .photo-frame { transform: scale(0.98); }
  .float-card:hover .float-card-inner,
  .float-card:focus-visible .float-card-inner {
    opacity: 0.92;
  }
  /* Mobile only: height is capped here instead of left to the image's own
     aspect ratio (the gallery cards' and desktop float cards' approach). A
     tall portrait placeholder at mobile's narrower widths could otherwise
     run past whatever text-free band its position was measured against —
     worse on a short viewport than a tall one, which no single hand-placed
     position can account for on its own. object-fit crops the image to fit.
     Desktop has the vertical room to just let photos be their own shape. */
  @media (max-width: 640px) {
    .float-card .photo-frame { height: clamp(52px, 8vh, 128px); }
  }
  .float-card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.92);
  }
  /* The autonomous drift lives on this inner wrapper so it composes cleanly
     with the outer element's JS-driven parallax transform instead of
     overwriting it. Duration/delay/amplitude are set per-card inline for a
     scattered, unsynchronised feel. */
  .float-card-inner {
    animation-name: floatDrift;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    opacity: 0.64;
    transition: opacity 0.4s var(--ease-spring);
  }
  @keyframes floatDrift {
    0%, 100% { transform: translate(0, 0) rotate(var(--fr, 1.4deg)); }
    50% { transform: translate(var(--fx, 14px), var(--fy, -18px)) rotate(calc(var(--fr, 1.4deg) * -1)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .float-card-inner { animation: none; }
  }

  /* ---------- Flight layer ---------- */
  /* Where a floating card lives while it flies into the gallery it belongs
     to — above the transition overlay, so the photo stays visible through
     the letters rushing past rather than disappearing when the view swaps. */
  #flight-layer {
    position: fixed;
    inset: 0;
    z-index: 10000;
    pointer-events: none;
  }
  .flight-card {
    position: fixed;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(27,24,21,0.08), 0 28px 50px -20px rgba(27,24,21,0.45);
  }
  .flight-card img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>

<body class="font-body text-ink bg-cream">

  <div class="grain"></div>
  <div class="rule-top"></div>
  <div class="rule-bottom"></div>

  <!-- ================= CUSTOM CURSOR ================= -->
  <div id="cursor-ring" aria-hidden="true">
    <span></span>
    <span class="scroll-hint">Scroll to discover</span>
  </div>

  <!-- ================= PAGE TRANSITION OVERLAY ================= -->
  <div id="transition-overlay" aria-hidden="true">
    <span class="to-line">Libby</span>
    <span class="to-line to-italic">Li</span>
  </div>

  <!-- ================= FLOAT-TO-GALLERY FLIGHT LAYER ================= -->
  <div id="flight-layer" aria-hidden="true"></div>

  <!-- ================= HEADER ================= -->
  <header id="site-header" class="site-header fixed top-2 left-0 right-0 z-[9999] px-5 sm:px-8 py-4">
    <div class="max-w-[1400px] mx-auto flex items-center justify-between">
      <a href="#home" class="font-mono text-xs sm:text-sm tracking-[0.18em] uppercase">Libby Li<span class="text-ink-soft">.</span></a>

      <button id="menu-btn" class="pill md:hidden px-4 py-2 font-mono text-[11px] tracking-[0.14em] uppercase" aria-label="Open menu" aria-expanded="false">
        Menu
      </button>
    </div>
  </header>

  <!-- ================= MOBILE NAV ================= -->
  <div id="mobile-nav">
    <div class="h-full flex flex-col items-center justify-center gap-8">
      <button id="menu-close" class="pill absolute top-6 right-6 px-4 py-2 font-mono text-[11px] tracking-[0.14em] uppercase" aria-label="Close menu">Close</button>
      <a href="#travel" class="font-display text-4xl text-ink-mid hover:text-ink transition-colors">Travel</a>
      <a href="#personal" class="font-display text-4xl text-ink-mid hover:text-ink transition-colors">Personal</a>
      <a href="#bruin" class="font-display text-4xl text-ink-mid hover:text-ink transition-colors">Daily Bruin</a>
    </div>
  </div>

  <!-- ================= HOME VIEW ================= -->
  <div class="view active" data-view="home">

  <!-- ================= HERO ================= -->
  <section id="top" class="relative h-[100dvh] flex flex-col items-center justify-center px-6 text-center overflow-hidden">

    <!-- Recent work, adrift behind the wordmark. Built in JS (below) from
         each category's own images, so it stays in sync with the galleries
         with nothing to keep in parallel by hand. Each photo is a real link
         into its category, so no aria-hidden here — that would hide focusable
         content from assistive tech while leaving it reachable by keyboard. -->
    <div class="hero-float-layer" id="hero-float"></div>

    <p class="hero-line from-top font-mono text-[11px] sm:text-xs tracking-[0.3em] uppercase text-ink-soft mb-6 relative z-10">
      Photographer
    </p>

    <!-- Tracking sits on the spans, not the h1: an em there would resolve
         against the h1's inherited 16px and all but vanish, and the transition
         overlay applies it at display size — leaving the two a glyph-width
         apart at the hand-off. -->
    <!-- Uppercased in CSS, not in the markup: the transition overlay finds the

  <!-- ================= LIGHTBOX ================= -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">

    <img id="lb-img" src="" alt="" />

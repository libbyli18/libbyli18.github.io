<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Libby Li</title>
<meta name="description" content="Libby Li: travel photographs, illustrations, and a little about her." />
<meta name="theme-color" content="#A9BFC7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="hill.css" />
</head>
<body>
  <header class="top">
    <a class="wordmark" href="./" aria-current="page">libbyli.jpg</a>
  </header>

  <main class="scene" id="scene">
    <h1 class="sr-only">Libby Li</h1>
    <div class="sky" aria-hidden="true"></div>
    <div class="layer sky-layer" aria-hidden="true"><div class="px" data-depth="0.2"><canvas id="sky" class="sky-canvas"></canvas></div></div>
    <div class="layer far-layer" aria-hidden="true"><div class="px" data-depth="0.5"><canvas id="far"></canvas></div></div>
    <div class="layer near-layer">
      <div class="px" data-depth="1" id="near-wrap">
        <canvas id="near" aria-hidden="true"></canvas>
        <nav class="words" id="words" aria-label="Main">
          <a class="word" href="photos.html"><span class="word-lift"><span class="word-tilt"><span class="word-ink">photos<i class="bl"></i></span></span></span></a>
          <a class="word" href="illustrations.html"><span class="word-lift"><span class="word-tilt"><span class="word-ink">illustrations<i class="bl"></i></span></span></span></a>
          <a class="word" href="about.html"><span class="word-lift"><span class="word-tilt"><span class="word-ink">about me<i class="bl"></i></span></span></span></a>
        </nav>
        <div class="shadows" id="shadows" aria-hidden="true"></div>
      </div>
    </div>
    <div class="grain" aria-hidden="true"></div>
  </main>

  <!-- Get the globe page ready while the pointer rests on "photos", so the
       rise off the hill lands straight on the globe. -->
  <script type="speculationrules">
    { "prerender": [{ "source": "list", "urls": ["photos.html"], "eagerness": "moderate" }] }
  </script>
  <script src="hill.js"></script>
  <script src="firefly.js"></script>
</body>
</html>

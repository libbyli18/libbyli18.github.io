<!-- Libby Li — Photography Portfolio -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Libby Li — Travel Photography & Photojournalism</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@300;400;500&display=swap"
  rel="stylesheet"
/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          // Two colours only. Everything else is a blend of the two, so the
          // whole palette sits on a single ink -> cream line with no hue of
          // its own — the tints below are that line at 5%, 78% and 71% ink.
          cream: "#F6F2E8",
          "cream-2": "#EBE7DD",
          ink: "#1B1815",
          "ink-mid": "#4B4843",
          "ink-soft": "#5B5752",
        },
        fontFamily: {
          display: ['"Fraunces"', "serif"],
          name: ['"EB Garamond"', "Garamond", "Georgia", "serif"],
          mono: ['"IBM Plex Mono"', "monospace"],
          body: ['"Work Sans"', "sans-serif"],
        },
      },
    },
  };
</script>

<style>
  :root {
    --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
    --line: rgba(27, 24, 21, 0.14);
  }

  * { box-sizing: border-box; }

  /* Every view is exactly one screen. Nothing scrolls past its edges — no
     page scroll, and no rubber-band overscroll at the boundaries either. */
  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    background: #F6F2E8;
    color: #1B1815;
  }

  /* ---------- Grain overlay ---------- */
  .grain {
    position: fixed;
    inset: 0;
    z-index: 9998;
    pointer-events: none;
    opacity: 0.05;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  /* ---------- Top / bottom rules ---------- */
  .rule-top, .rule-bottom {
    position: fixed;
    left: 0; right: 0;
    height: 2px;
    background: #1B1815;
    z-index: 9999;
  }
  .rule-top { top: 0; }
  .rule-bottom { bottom: 0; }

  /* ---------- Header ---------- */
  .site-header {
    transition: background-color 0.4s ease;
    /* The header's own box spans the full viewport width at a fixed z-index
       (9999) even where nothing is rendered in it (the whole right side, on
       desktop, since the mobile menu button is hidden there) — which was
       silently swallowing clicks meant for the lightbox's close button
       underneath it, since z-index only orders full stacking contexts, not
       "empty" regions within one. Reopening pointer-events on just the real
       interactive children lets clicks fall through everywhere else. */
    pointer-events: none;
  }
  .site-header a, .site-header button {
    pointer-events: auto;
  }

  .nav-link {
    position: relative;
    padding-bottom: 3px;
  }
  .nav-link::after {
    content: "";
    position: absolute;
    left: 0; bottom: 0;
    width: 100%; height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.4s var(--ease-spring);
  }
  .nav-link:hover::after,
  .nav-link:focus-visible::after {
    transform: scaleX(1);
    transform-origin: left;
  }

  /* ---------- Pills ---------- */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #F6F2E8;
    transition: transform 0.35s var(--ease-spring),
      box-shadow 0.35s var(--ease-spring),
      border-color 0.35s var(--ease-spring),
      background-color 0.35s var(--ease-spring);
    box-shadow: 0 1px 2px rgba(27,24,21,0.05);
  }
  .pill:hover {
    transform: translateY(-2px);
    border-color: rgba(27,24,21,0.42);
    box-shadow: 0 1px 2px rgba(27,24,21,0.06), 0 10px 24px -10px rgba(27,24,21,0.42);
  }
  .pill:active { transform: translateY(0px) scale(0.98); }
  .pill:focus-visible {
    outline: 2px solid #1B1815;
    outline-offset: 2px;
  }

  /* ---------- Hero ---------- */
  /* Hero elements converge on one beat: everything above centre drops in from
     the top, everything below it rises from the bottom. No stagger — the
     direction does the work, so they all land together. */
  .hero-line {
    display: block;
    opacity: 0;
    animation-duration: 1s;
    animation-timing-function: var(--ease-spring);
    animation-fill-mode: forwards;
  }
  .hero-line.from-top { animation-name: heroDropIn; }
  .hero-line.from-bottom { animation-name: heroRiseIn; }
  @keyframes heroDropIn {
    from { opacity: 0; transform: translateY(-80px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes heroRiseIn {
    from { opacity: 0; transform: translateY(80px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .float-slow {
    animation: float 7s ease-in-out infinite;
  }
  .float-slow-rev {
    animation: float 8s ease-in-out infinite reverse;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  /* ---------- Photo reveal ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(26px);
    transition: opacity 0.8s var(--ease-spring), transform 0.8s var(--ease-spring);
  }
  .reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ---------- Photo grid (endless, both axes) ---------- */
  /* A real pannable canvas — wider than the viewport (more photos just add
     columns) and taller than it too (see .gallery-track's height), so the
     whole field is explorable in any direction, not just sideways. */
  .gallery-viewport {
    overflow: auto;
    /* The track is the only thing that moves; hitting an edge stops dead
       rather than bouncing the page or triggering a back-swipe. */
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    cursor: grab;
    height: 100dvh;
  }
  .gallery-viewport::-webkit-scrollbar { display: none; }
  .gallery-viewport.dragging { cursor: grabbing; }

  /* CSS multi-column, not grid or flex-wrap: both of those size an entire
     row/column track to its largest member, which would leave dead space
     next to every narrower photo. A column's WIDTH here is fixed instead,
     and each photo's own aspect ratio (set inline) determines its HEIGHT at
     that width — the classic Pinterest-style masonry, and the only one of
     the three that gives every photo genuinely independent sizing with no
     wasted space. column-fill: auto fills one column top-to-bottom before
     starting the next, rather than balancing all columns to equal height.
     The fixed height below is what forces that overflow into new columns
     at all — without it there'd be nothing to spill sideways from. */
  .gallery-track {
    columns: 280px;
    column-gap: 16px;
    column-fill: auto;
    height: 230dvh;
    width: max-content;
  }
  @media (max-width: 860px) {
    .gallery-track { columns: 220px; column-gap: 12px; height: 210dvh; }
  }

  .photo-card {
    position: relative;
    cursor: pointer;
    width: 100%;
    margin-bottom: 16px;
    break-inside: avoid;
  }
  @media (max-width: 860px) {
    .photo-card { margin-bottom: 12px; }
  }
  /* Fills the column's fixed width; height follows from the frame's own
     inline aspect-ratio rather than being forced to match its neighbours. */
  .gallery-track .photo-frame {
    width: 100%;
    height: auto;
    box-shadow: none;
    border-radius: 0;
  }

  /* Fixed to the viewport, not the track — the track is now taller and
     wider than one screen in every direction, so anything positioned as a
     percentage of it could easily land off past whatever edge is currently
     scrolled into view. */
  .scroll-cue {
    position: fixed;
    left: 1.75rem;
    bottom: 1.75rem;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
  }

  .back-pill {
    position: fixed;
    bottom: 1.75rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9995;           /* above the flight layer, so no flying photo covers it */
    opacity: 0;              /* shown by JS whenever the hero words are hidden */
    pointer-events: none;
  }
  /* Keep the centered pill's hover/active lift from cancelling the centering. */
  .back-pill:hover { transform: translateX(-50%) translateY(-2px); }
  .back-pill:active { transform: translateX(-50%) scale(0.98); }

  .photo-frame {
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    background: #EBE7DD;
    box-shadow: 0 1px 2px rgba(27,24,21,0.06), 0 14px 30px -18px rgba(27,24,21,0.35);
  }
  .photo-card img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: saturate(0.94);
    pointer-events: none;
    -webkit-user-drag: none;
  }

  .card-count {
    display: block;
    margin-top: 0.4rem;
    text-align: right;
    font-size: 0.6rem;
    letter-spacing: 0.08em;
    color: #5B5752;
  }
  /* Flush grid tiles have no room below the image for a caption without
     breaking the row alignment, so it sits over the bottom edge instead —
     a scrim keeps it legible against any photo. */
  .gallery-track .card-count {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    margin: 0;
    padding: 14px 8px 5px;
    text-align: left;
    color: #F6F2E8;
    background: linear-gradient(to top, rgba(27,24,21,0.55), transparent);
    opacity: 0;
    transition: opacity 0.3s var(--ease-spring);
  }
  /* Only shown on the photo being looked at (or focused from the keyboard). */
  .gallery-track .photo-card:hover .card-count,
  .gallery-track .photo-card:focus-visible .card-count { opacity: 1; }

  /* ---------- Lightbox ---------- */
  /* The viewer itself never fades — only its backdrop and controls do — so
     the photo flying in from the grid is fully solid the whole way. */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 9997;                /* under the grain and rules, like the grid photos */
    visibility: hidden;
    pointer-events: none;
  }
  #lightbox.open, #lightbox.closing { visibility: visible; }
  #lightbox.open { pointer-events: auto; }
  #lightbox .lb-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(27,24,21,0.94);
    backdrop-filter: blur(6px);
    opacity: 0;
    transition: opacity 0.45s var(--ease-spring);
  }
  #lightbox.open .lb-backdrop { opacity: 1; }
  #lb-close, #lb-caption {
    z-index: 2;
    opacity: 0;
    transition: opacity 0.45s var(--ease-spring), transform 0.3s var(--ease-spring), border-color 0.3s ease;
  }
  #lightbox.open #lb-close, #lightbox.open #lb-caption { opacity: 1; }
  /* The gallery as one horizontal strip; the current photo sits in the
     centre and the strip slides to bring the next one there. */
  #lb-strip {
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 1;
    will-change: transform;
  }
  .lb-photo {
    position: absolute;
    cursor: pointer;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
    will-change: transform, opacity;
  }
  .lb-photo.is-current { cursor: default; }
  .lb-photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.94);
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .lb-btn:hover { transform: scale(1.08); border-color: rgba(246,242,232,0.6); }
  .lb-btn:active { transform: scale(0.94); }
  /* Cream, not ink — this one sits on the dark lightbox backdrop. */
  .lb-btn:focus-visible { outline: 2px solid #F6F2E8; outline-offset: 2px; }

  /* ---------- Mobile nav overlay ---------- */
  #mobile-nav {
    position: fixed; inset: 0; z-index: 9996;
    background: #F6F2E8;
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s var(--ease-spring);
  }
  #mobile-nav.open { opacity: 1; pointer-events: auto; }
  #mobile-nav a {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.5s var(--ease-spring), transform 0.5s var(--ease-spring);
  }
  #mobile-nav.open a { opacity: 1; transform: translateY(0); }
  #mobile-nav a:nth-of-type(1) { transition-delay: 0.05s; }
  #mobile-nav a:nth-of-type(2) { transition-delay: 0.1s; }
  #mobile-nav a:nth-of-type(3) { transition-delay: 0.15s; }
  #mobile-nav a:nth-of-type(4) { transition-delay: 0.2s; }

  ::selection { background: #1B1815; color: #F6F2E8; }

  /* Baseline focus ring in ink. Without it the UA default paints a blue one —
     the one colour on the site that isn't ink or cream. Elements with their
     own focus treatment (pills, lightbox buttons, nav underline) override it. */
  a:focus-visible,
  button:focus-visible,
  [tabindex]:focus-visible {
    outline: 2px solid #1B1815;
    outline-offset: 3px;
    border-radius: 2px;
  }

  /* ---------- Custom ring cursor ---------- */
  /* Only enabled for fine pointers; !important because plenty of elements set
     their own cursor (grab, pointer, ...) that would otherwise win. */
  .custom-cursor, .custom-cursor * { cursor: none !important; }

  #cursor-ring {
    position: fixed;
    top: 0; left: 0;
    z-index: 10001;
    pointer-events: none;
    will-change: transform;
    /* Blend lives on this element, not the inner span: a child's mix-blend-mode
       is confined to its parent's stacking context, and the z-index here makes
       one — so blending inside would composite against nothing. Inverting
       against the backdrop keeps the ring legible on the cream field and on
       the dark lightbox alike. */
    mix-blend-mode: difference;
  }
  /* Inner element carries the look, so JS can own the outer transform
     (position) without the two fighting over the same property. */
  #cursor-ring span {
    display: block;
    width: 34px; height: 34px;
    margin: -17px 0 0 -17px;
    border: 1.5px solid #fff;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0);
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 0.35s var(--ease-spring),
                transform 0.35s var(--ease-spring),
                background-color 0.35s var(--ease-spring);
  }
  /* :not(.scroll-hint) matters: both children are <span> elements, so a
     plain "span" selector here would also flip the hint to visible any time
     the ring is (i.e. always) — not just where it's meant to appear, inside
     .lightbox-mode. */
  #cursor-ring.is-visible span:not(.scroll-hint) { opacity: 1; transform: scale(1); }
  /* Over anything clickable the outline floods solid — read through the
     difference blend, that inverts whatever sits under it, so the filled disc
     stays legible on the cream field and on a dark photo alike. */
  #cursor-ring.over-target span { background: rgba(255, 255, 255, 1); }

  /* Inside the lightbox the ring gives way to a label, since scrolling — not
     clicking — is how you move through the set. Same outer element, same
     position/easing already driven by JS; only which child is visible swaps. */
  #cursor-ring .scroll-hint {
    position: absolute;
    top: 0; left: 0;
    width: max-content;
    margin: -10px 0 0 18px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.7);
    font-family: "IBM Plex Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #fff;
    white-space: nowrap;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.35s var(--ease-spring), transform 0.35s var(--ease-spring);
  }
  #cursor-ring.lightbox-mode span { opacity: 0; transform: scale(0.4); }
  #cursor-ring.lightbox-mode.is-visible .scroll-hint { opacity: 1; transform: scale(1); }

  /* ---------- Views (home vs. individual galleries) ---------- */
  /* Only hide inactive views — leave "active" display untouched so each
     view's own utility classes (block, flex, ...) decide its layout. */
  .view:not(.active) { display: none; }

  /* Where a hero photo lives mid-flight between the hero and its grid
     slot, in either direction. Positioned in JS via FLIP, so only
     transform is ever animated here, never left/top directly. */
  #flight-layer {
    position: fixed;
    inset: 0;
    /* Under the grain (9998) and the top/bottom rules (9999), exactly like
       the photos it stands in for — otherwise the grain and rules would
       appear on a photo the moment its clone is swapped for it. Still above
       both views, and under the Home button (9995). */
    z-index: 9994;
    pointer-events: none;
  }
  .work-flight-card {
    position: fixed;
    will-change: transform;
  }
  /* Never transformed — only fades in over the landing clone (see runEnterWork). */
  .work-flight-card.flight-settle {
    opacity: 0;
    will-change: opacity;
  }
  /* The hero cards have this shadow and the grid photos have none, so it
     sits on its own layer and fades over the flight (out on the way to the
     grid, in on the way back) — nothing changes where the clone meets a card. */
  .work-flight-card .flight-shadow {
    position: absolute;
    inset: 0;
    box-shadow: 0 1px 2px rgba(27,24,21,0.05), 0 18px 34px -20px rgba(27,24,21,0.4);
  }
  /* Same square corners and colour treatment as both the hero and grid photos. */
  .work-flight-card img {
    position: relative;
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: saturate(0.94);
  }

  /* ---------- Hero name ---------- */
  /* "Libby" anchored to the right edge, "Li" to the left and lower — two
     names, two corners, rather than one centred wordmark. */
  .hero-name {
    position: absolute;
    z-index: 10;
    margin: 0;
    font-family: "EB Garamond", Garamond, Georgia, serif;
    font-size: clamp(2.75rem, 9vw, 6.5rem);
    line-height: 1;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: #1B1815;
    white-space: nowrap;
  }
  .hero-name-libby {
    right: 5vw;
    top: 36%;
    font-weight: 500;
    text-align: right;
  }
  .hero-name-li {
    left: 5vw;
    top: 54%;
    font-style: italic;
    font-weight: 400;
    text-align: left;
  }
  @media (max-width: 640px) {
    .hero-name { font-size: clamp(2.4rem, 15vw, 3.6rem); }
    .hero-name-libby { right: 6vw; top: 30%; }
    .hero-name-li { left: 6vw; top: 58%; }
  }
  /* A scroll gesture sends each name further the way it was already leaning
     — Libby further right, Li further left — rather than to a neutral
     centre, so the exit reads as a continuation of where they sit, not a
     generic fade. Driven entirely via inline styles from JS (see
     settleHero/exitHeroText) rather than a class here — a completed
     entrance animation's forwards-fill outranks a class-based transition on
     the same property, so this has to out-inline-style it instead. */

  /* ---------- Scroll-to-enter prompt ---------- */
  .scroll-enter {
    position: absolute;
    z-index: 10;
    bottom: 2.5rem;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    color: #5B5752;
  }
  .scroll-enter .stem {
    width: 1px;
    height: 22px;
    background: currentColor;
    opacity: 0.4;
    animation: scrollEnterBob 1.8s var(--ease-spring) infinite;
  }
  @keyframes scrollEnterBob {
    0%, 100% { transform: scaleY(1); opacity: 0.4; }
    50% { transform: scaleY(0.5); opacity: 0.75; }
  }
  @media (prefers-reduced-motion: reduce) {
    .scroll-enter .stem { animation: none; }
  }

  /* ---------- Hero float (3D) ---------- */
  /* Recent photos drift in a shallow 3D field behind the name — sits below
     the hero copy (z-10 there vs. z-0 here) and clipped by #top's own
     overflow-hidden, so depth and drift can never push a card past the edge.
     Perspective lives on the layer, not the cards, so every card shares one
     consistent vanishing point rather than each getting its own. */
  .hero-float3d {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    perspective: 1400px;
  }
  .float3d-card {
    position: absolute;
    display: block;
    /* left/top/width are set by layoutFloat3d from the number of cards. */
    pointer-events: auto;
    transform-style: preserve-3d;
  }
  .float3d-inner {
    animation-name: float3dDrift;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    transform-style: preserve-3d;
  }
  .float3d-inner .photo-frame {
    border-radius: 0;
    box-shadow: 0 1px 2px rgba(27,24,21,0.05), 0 18px 34px -20px rgba(27,24,21,0.4);
  }
  .float3d-card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: saturate(0.94);
  }
  @keyframes float3dDrift {
    0%, 100% {
      transform: translate3d(0, 0, 0) rotateX(0deg) rotateY(0deg) rotate(var(--fr, 1.4deg));
    }
    50% {
      transform: translate3d(var(--fx, 14px), var(--fy, -18px), var(--fz, 40px))
        rotateX(var(--frx, 6deg)) rotateY(var(--fry, -8deg)) rotate(calc(var(--fr, 1.4deg) * -1));
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .float3d-inner { animation: none; }
  }

  /* ---------- Loading screen ---------- */
  /* A cream cover with one ring in the middle that draws itself round as the
     hero loads, then shrinks into the cursor ring (see pageLoader). The
     hero's entrance waits, paused, until the cover starts to clear. */
  html.is-loading .hero-line { animation-play-state: paused; }
  #loader {
    position: fixed;
    inset: 0;
    z-index: 10002;               /* above everything, the cursor ring included */
    background: #F6F2E8;
    transition: opacity 600ms var(--ease-spring);
  }
  #loader.is-done { opacity: 0; pointer-events: none; }
  /* Built like #cursor-ring: a zero-size point moved to the ring's centre,
     with the drawing hung off it. */
  #loader-ring {
    position: fixed;
    top: 0; left: 0;
    z-index: 10003;
    pointer-events: none;
    mix-blend-mode: difference;   /* the same inverting ink as the cursor ring it becomes */
    will-change: transform;
  }
  #loader-ring svg {
    position: absolute;
    left: -50px; top: -50px;
    width: 100px; height: 100px;
    overflow: visible;
  }
  #loader-ring circle { fill: none; stroke: #fff; stroke-width: 1.5; }
  #loader-ring .track { stroke-opacity: 0.16; }
  #loader-ring .arc { transform: rotate(-90deg); transform-origin: 50px 50px; } /* starts at 12 o'clock */
  /* Once the arc closes, this takes over for the shrink: the same CSS circle
     as the cursor ring (border, not SVG stroke — the two are antialiased a
     little differently), so at 34px it is pixel-for-pixel the cursor. */
  #loader-ring .disc {
    position: absolute;
    display: none;
    border: 1.5px solid #fff;
    border-radius: 50%;
  }
</style>

<body class="font-body text-ink bg-cream">

  <!-- ================= LOADING SCREEN ================= -->
  <div id="loader" aria-hidden="true"></div>
  <div id="loader-ring" aria-hidden="true">
    <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="44" /><circle class="arc" cx="50" cy="50" r="44" /></svg>
    <span class="disc"></span>
  </div>
  <script>
    // ---------------- Loading screen ----------------
    // Runs before anything else on the page, so the ring is up from the first
    // paint. Progress is a weighted sum of what the hero actually needs; the
    // main script reports its parts (data, hero photos, layout) as they land.
    // The drawn arc eases toward that sum rather than jumping to it.
    window.pageLoader = (() => {
      const root = document.documentElement;
      root.classList.add("is-loading", "cursor-pending");
      const bg = document.getElementById("loader");
      const ring = document.getElementById("loader-ring");
      const svg = ring.querySelector("svg");
      const disc = ring.querySelector(".disc");
      const arc = ring.querySelector(".arc");
      const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const D_START = 89.5;    // outer diameter of the drawn ring (r 44 + half the 1.5px stroke, doubled)
      const D_CURSOR = 34;     // the cursor ring's outer diameter
      const SHRINK_MS = 700;
      const ARC_EASE = 0.12;
      const parts = { dom: [0.1, 0], fonts: [0.15, 0], data: [0.15, 0], images: [0.5, 0], layout: [0.1, 0] };
      const ARC_LEN = 2 * Math.PI * 44;
      let shown = 0, rafId = null, handoff, finishing = false, pointer = null;

      const centre = () => ({ x: innerWidth / 2, y: innerHeight / 2 });
      const place = (p) => { ring.style.transform = `translate(${p.x}px, ${p.y}px)`; };
      const setDiameter = (d) => Object.assign(disc.style, { width: `${d}px`, height: `${d}px`, margin: `${-d / 2}px 0 0 ${-d / 2}px` });
      const drawArc = (p) => { arc.style.strokeDasharray = `${ARC_LEN}`; arc.style.strokeDashoffset = `${ARC_LEN * (1 - p)}`; };
      place(centre());
      drawArc(0);
      addEventListener("resize", () => { if (!finishing) place(centre()); });
      addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") pointer = { x: e.clientX, y: e.clientY }; }, { passive: true });

      const target = () => Object.values(parts).reduce((sum, [w, f]) => sum + w * f, 0);
      function tick() {
        const t = target();
        shown += (t - shown) * ARC_EASE;
        if (t - shown < 0.002) shown = t;
        drawArc(shown);
        if (shown >= 0.999 && handoff !== undefined) { rafId = null; shrink(); return; }
        rafId = shown < t ? requestAnimationFrame(tick) : null;
      }
      const wake = () => { if (rafId === null && !finishing) rafId = requestAnimationFrame(tick); };

      // Full: the cover fades as the ring shrinks to cursor size and glides
      // to wherever the pointer is (following it if it moves meanwhile).
      const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      function shrink() {
        finishing = true;
        root.classList.remove("is-loading");
        bg.classList.add("is-done");
        setDiameter(D_START);
        disc.style.display = "block";
        svg.style.display = "none";
        const from = centre();
        if (REDUCE) {
          setDiameter(D_CURSOR);
          return end(pointer || from);
        }
        const start = performance.now();
        (function step(now) {
          const k = Math.min(1, (now - start) / SHRINK_MS), e = easeInOut(k);
          const to = pointer || from;
          place({ x: from.x + (to.x - from.x) * e, y: from.y + (to.y - from.y) * e });
          setDiameter(D_START + (D_CURSOR - D_START) * e);
          if (k < 1) requestAnimationFrame(step); else end(to);
        })(start);
      }
      function end(point) {
        root.classList.remove("cursor-pending");
        if (handoff) {
          handoff(point.x, point.y); // the cursor ring appears exactly where this one is
          ring.remove();
        } else {
          ring.style.transition = "opacity 250ms ease";
          ring.style.opacity = "0";
          setTimeout(() => ring.remove(), 300);
        }
        setTimeout(() => bg.remove(), 700);
      }

      const api = {
        report(name, fraction) {
          if (!parts[name]) return;
          parts[name][1] = Math.max(parts[name][1], Math.min(1, fraction));
          wake();
        },
        // Called once the hero is ready; onHandoff(x, y) shows the real cursor
        // ring there (null where there's no mouse, or if it's not ready).
        finish(onHandoff) {
          if (handoff !== undefined) return;
          handoff = onHandoff || null;
          Object.values(parts).forEach((p) => { p[1] = 1; });
          wake();
        },
      };
      document.addEventListener("DOMContentLoaded", () => api.report("dom", 1));
      document.fonts.ready.then(() => api.report("fonts", 1));
      setTimeout(() => api.finish(null), 15000); // never leave the cover up if something stalls
      return api;
    })();
  </script>

  <div class="grain"></div>
  <div class="rule-top"></div>

  <!-- ================= CUSTOM CURSOR ================= -->

  <!-- ================= WORK (unified grid) ================= -->

       (see buildWorkGrid). -->
  <section id="work" class="view" data-view="work">
    <div class="gallery-viewport" id="viewport-work">
      <div class="gallery-track" id="grid-work">
        <span class="scroll-cue font-mono text-[10px] tracking-[0.2em] uppercase text-ink-soft">Scroll to discover</span>
      </div>

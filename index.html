  <canvas class="firefly" id="firefly" aria-hidden="true"></canvas>
  <script>
  // ================= Firefly cursor =================
  // A soft point of warm light, with no hard edge: it trails a faint misty
  // tail and now and then lets a mote drift up and away as it moves. Only for fine pointers (mouse, trackpad); touch
  // screens keep their normal behaviour. With reduced motion the sphere
  // still follows the pointer, but without the tail or sparks.
  (function () {
    if (!matchMedia("(pointer: fine)").matches) return;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const cv = document.getElementById("firefly");
    const ctx = cv.getContext("2d");
    document.documentElement.classList.add("has-firefly");

    let dpr = 1, vw = 0, vh = 0;
    function size() {
      dpr = Math.min(2, devicePixelRatio || 1);
      vw = innerWidth; vh = innerHeight;
      cv.width = vw * dpr; cv.height = vh * dpr;
    }
    size();
    addEventListener("resize", size);

    // Everything is drawn from one feathered glow, so no part of the light
    // has an edge: a near-Gaussian falloff of warm ivory.
    const GLOW = 128;
    const glow = document.createElement("canvas");
    glow.width = glow.height = GLOW;
    {
      const g = glow.getContext("2d");
      const grad = g.createRadialGradient(GLOW / 2, GLOW / 2, 0, GLOW / 2, GLOW / 2, GLOW / 2);
      grad.addColorStop(0, "rgba(255, 252, 238, 1)");
      grad.addColorStop(0.16, "rgba(255, 249, 228, 0.82)");
      grad.addColorStop(0.32, "rgba(250, 243, 216, 0.5)");
      grad.addColorStop(0.52, "rgba(245, 238, 210, 0.2)");
      grad.addColorStop(0.74, "rgba(242, 236, 214, 0.06)");
      grad.addColorStop(1, "rgba(242, 236, 214, 0)");
      g.fillStyle = grad;
      g.fillRect(0, 0, GLOW, GLOW);
    }
    const light = (x, y, d, alpha) => {
      if (alpha <= 0.004) return;
      ctx.globalAlpha = Math.min(1, alpha);
      ctx.drawImage(glow, x - d / 2, y - d / 2, d, d);
    };

    const mouse = { x: -100, y: -100 };
    const orb = { x: -100, y: -100, r: 6, targetR: 6, alpha: 0, targetAlpha: 0 };
    const trail = [];  // recent positions of the orb: {x, y, t}
    const sparks = []; // {x, y, vx, vy, born, life, r, phase}
    const TRAIL_MS = 360;
    let down = false, over = false, raf = null, last = performance.now();

    const INTERACTIVE = "a, button, [role='button'], .pin, summary, label";
    addEventListener("pointermove", (e) => {
      if (e.pointerType && e.pointerType !== "mouse" && e.pointerType !== "pen") return;
      mouse.x = e.clientX; mouse.y = e.clientY;
      if (orb.alpha === 0 && orb.targetAlpha === 0) { orb.x = mouse.x; orb.y = mouse.y; }
      orb.targetAlpha = 1;
      over = !!(e.target.closest && e.target.closest(INTERACTIVE));
      wake();
    }, { passive: true });
    addEventListener("pointerdown", () => { down = true; wake(); });
    addEventListener("pointerup", () => { down = false; wake(); });
    document.addEventListener("mouseleave", () => { orb.targetAlpha = 0; wake(); });
    document.documentElement.addEventListener("mouseleave", () => { orb.targetAlpha = 0; wake(); });

    function wake() { if (raf === null) { last = performance.now(); raf = requestAnimationFrame(tick); } }

    function tick(now) {
      const dt = Math.min(48, now - last); last = now;
      const f = (k) => 1 - Math.pow(1 - k, dt / 16.7); // frame-rate independent easing

      // The orb trails just behind the pointer, so the tail has room to form.
      orb.x += (mouse.x - orb.x) * f(reduce ? 1 : 0.27);
      orb.y += (mouse.y - orb.y) * f(reduce ? 1 : 0.27);
      orb.targetR = down ? 4.6 : over ? 8.5 : 6;
      orb.r += (orb.targetR - orb.r) * f(0.14);
      orb.alpha += (orb.targetAlpha - orb.alpha) * f(0.12);

      if (!reduce) {
        trail.push({ x: orb.x, y: orb.y, t: now });
        while (trail.length && now - trail[0].t > TRAIL_MS) trail.shift();
        // Sparks come off in proportion to how fast it's moving.
        const prev = trail[trail.length - 2];
        const speed = prev ? Math.hypot(orb.x - prev.x, orb.y - prev.y) : 0;
        if (sparks.length < 14 && Math.random() < Math.min(0.35, speed / 22)) {
          sparks.push({
            x: orb.x + (Math.random() - 0.5) * 8, y: orb.y + (Math.random() - 0.5) * 8,
            vx: (Math.random() - 0.5) * 0.012, vy: -0.006 - Math.random() * 0.012,
            born: now, life: 1400 + Math.random() * 1200, r: 1.2 + Math.random() * 1.2, phase: Math.random() * 6.28,
          });
        }
        for (let i = sparks.length - 1; i >= 0; i--) if (now - sparks[i].born > sparks[i].life) sparks.splice(i, 1);
      }

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, vw, vh);
      const a = orb.alpha;

      if (a > 0.01) {
        // A faint cool shadow just below the light, the way the page's own
        // surfaces cast theirs: it keeps the light findable on the pale sky
        // without giving it a rim.
        const pulse = reduce ? 1 : 1 + 0.05 * Math.sin(now * 0.0024);
        const R = orb.r * pulse;
        ctx.globalAlpha = 1;
        const shade = ctx.createRadialGradient(orb.x, orb.y + R * 0.5, 0, orb.x, orb.y + R * 0.5, R * 3.4);
        shade.addColorStop(0, `rgba(51, 64, 63, ${(0.16 * a).toFixed(3)})`);
        shade.addColorStop(0.5, `rgba(51, 64, 63, ${(0.05 * a).toFixed(3)})`);
        shade.addColorStop(1, "rgba(51, 64, 63, 0)");
        ctx.fillStyle = shade;
        ctx.beginPath(); ctx.arc(orb.x, orb.y + R * 0.5, R * 3.4, 0, Math.PI * 2); ctx.fill();

        // Tail: a mist of soft light thinning out behind it.
        for (let i = 0; i < trail.length - 1; i++) {
          const k = (i + 1) / trail.length; // near 0 at the end of the tail, 1 at the light
          light(trail[i].x, trail[i].y, R * (1.4 + 2.2 * k), 0.3 * k * k * a);
        }

        // Motes: drift up and away, swelling in and out of view slowly.
        for (const m of sparks) {
          const age = (now - m.born) / m.life;
          m.x += m.vx * dt; m.y += m.vy * dt;
          m.vx += Math.sin(now * 0.0016 + m.phase) * 0.00018 * dt;
          const env = Math.sin(Math.PI * Math.min(1, age)); // fades in, then out
          const twinkle = 0.8 + 0.2 * Math.sin(now * 0.005 + m.phase);
          light(m.x, m.y, m.r * 6, 0.7 * env * twinkle * a);
        }

        // The light: a wide breath of glow, then a brighter heart, each
        // feathered all the way out.
        light(orb.x, orb.y, R * 7.5, 0.5 * a);
        light(orb.x, orb.y, R * 2.8, 0.95 * a);
        light(orb.x, orb.y, R * 1.3, a);
        ctx.globalAlpha = 1;
      }

      // Keep running while anything is still moving, pulsing or fading.
      const settling = Math.abs(mouse.x - orb.x) > 0.3 || Math.abs(mouse.y - orb.y) > 0.3 ||
        trail.length > 1 || sparks.length || Math.abs(orb.alpha - orb.targetAlpha) > 0.01 ||
        Math.abs(orb.r - orb.targetR) > 0.05;
      if (settling || (!reduce && orb.alpha > 0.01)) raf = requestAnimationFrame(tick);
      else raf = null;
    }
  })();
  </script>

  <!-- Regenerated by `node build-photos.mjs` — see photos/README.md. -->
  <script src="photos-data.js"></script>
  <!-- Pin locations for each gallery — edit by hand. -->
  <script src="places.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>

  <script type="module">
  import * as THREE from "three";
  import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const D2R = Math.PI / 180;
  document.getElementById("year").textContent = new Date().getFullYear();

  // Seeded PRNG (mulberry32), so the trees and animals land in the same
  // places on every visit.
  function makeRng(seed) {
    let t = seed >>> 0;
    return () => {
      t += 0x6d2b79f5;
      let x = t;
      x = Math.imul(x ^ (x >>> 15), x | 1);
      x ^= x + Math.imul(x ^ (x >>> 7), x | 61);
      return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
    };
  }
  const loadImg = (url) => new Promise((res, rej) => {
    const im = new Image();
    im.crossOrigin = "anonymous";
    im.onload = () => res(im);
    im.onerror = rej;
    im.src = url;
  });

  // ================= Data =================
  // Folder galleries from photos-data.js, plus anything posted through the
  // upload page. If the upload API is slow or down, the folder ones still show.
  const API_BASE = "https://upload.libbyli.me";
  const galleryData = [...(window.REAL_PHOTOS || [])];
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 4000);
    const res = await fetch(`${API_BASE}/api/photos`, { signal: controller.signal });
    clearTimeout(timer);
    if (res.ok) {
      const live = await res.json();
      galleryData.push(...live.map((card) => ({
        sets: card.photos.map((p) => ({ w: p.width, h: p.height, t: card.title, src: `${API_BASE}/uploads/${p.filename}` })),
      })));
    }
  } catch { /* offline or timed out — folder galleries only */ }

  const PLACES = window.PLACES || {};
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  // A trip's date is "YYYY-MM" or "YYYY" in places.js; it orders the list
  // (newest first) and names the month-and-year heading the trip sits under.
  const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  function parseDate(d) {
    const m = /^(\d{4})(?:-(\d{1,2}))?$/.exec(String(d || "").trim());
    if (!m) return null;
    const year = +m[1], month = m[2] ? +m[2] : 0;
    if (month > 12) return null;
    return { key: year * 100 + month, label: month ? `${MONTHS[month - 1]} ${year}` : String(year) };
  }
  const trips = galleryData.filter((g) => g.sets.length).map((g, order) => {
    const title = g.sets[0].t;
    const place = PLACES[title] || null;
    const date = parseDate(place?.date);
    return {
      id: `trip-${slug(title)}`,
      name: place?.name || title,
      when: place?.when || date?.label || "",
      date, order,
      lat: place?.lat, lng: place?.lng,
      pinned: !!place,
      photos: g.sets,
    };
  }).sort((a, b) => (b.date?.key ?? -1) - (a.date?.key ?? -1) || a.order - b.order);
  const countLabel = (n) => `${n} photo${n === 1 ? "" : "s"}`;
  const metaLabel = (trip) => (trip.when ? `${trip.when}, ${countLabel(trip.photos.length)}` : countLabel(trip.photos.length));

  // ================= Photos: place list + hover preview =================
  const previewEl = document.getElementById("preview");
  const placesEl = document.getElementById("places");
  const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
  const setEls = [], rowEls = [];
  let activeTrip = -1;

  function activateTrip(ti) {
    if (ti === activeTrip || !trips[ti]) return;
    activeTrip = ti;
    setEls.forEach((el, i) => { el.classList.toggle("is-active", i === ti); el.inert = i !== ti; });
    rowEls.forEach((el, i) => el.classList.toggle("is-active", i === ti));
  }

  trips.forEach((trip, ti) => {
    // The preview: a still column of this place's photos.
    const set = document.createElement("div");
    set.className = "preview-set";
    set.inert = true;
    const track = document.createElement("div");
    track.className = "preview-track";
    const n = trip.photos.length;
    trip.photos.forEach((p, pi) => {
      const b = document.createElement("button");
      b.className = "preview-photo photo";
      b.style.aspectRatio = `${p.w} / ${p.h}`;
      b.setAttribute("aria-label", `Open ${trip.name}, photo ${pi + 1} of ${n}`);
      const img = document.createElement("img");
      img.src = p.src;
      img.alt = "";
      img.decoding = "async";
      b.appendChild(img);
      b.addEventListener("click", () => openLightbox(ti, pi, b));
      track.appendChild(b);
    });
    set.appendChild(track);
    previewEl.appendChild(set);
    setEls.push(set);

    // The list row. Titles can come from the upload page, so text only.
    const li = document.createElement("li");
    li.id = trip.id;
    li.innerHTML = `<button class="place-name-btn"><span class="place-label"></span><span class="place-count"></span></button><div class="place-extra"></div>`;
    li.querySelector(".place-label").textContent = trip.name;
    li.querySelector(".place-count").textContent = String(n);
    const nameBtn = li.querySelector(".place-name-btn");
    nameBtn.setAttribute("aria-label", `${trip.name}, ${metaLabel(trip)}`);
    nameBtn.addEventListener("pointerenter", (e) => { if (e.pointerType === "mouse") activateTrip(ti); });
    // Keyboard focus previews too (a tap also focuses, but that is the click's job).
    nameBtn.addEventListener("focus", () => { if (nameBtn.matches(":focus-visible")) activateTrip(ti); });
    // With a mouse, hovering previews and clicking opens the photos; on a
    // touch screen, tapping is how you preview.
    nameBtn.addEventListener("click", () => {
      if (canHover || activeTrip === ti) openLightbox(ti, 0, nameBtn);
      else activateTrip(ti);
    });
    if (trip.pinned) {
      const g = document.createElement("button");
      g.className = "frost";
      g.textContent = "globe view";
      g.addEventListener("click", async () => {
        if (scenes.active()) await scenes.go("globe");
        else {
          document.getElementById("top").scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth" });
          await wait(reduceMotion ? 0 : 500);
        }
        findOnGlobe(ti);
      });
      li.querySelector(".place-extra").appendChild(g);
    }
    // A heading for each new month (or year); undated trips go last, under none.
    const label = trip.date?.label || "";
    if (!placesEl.lastElementChild || placesEl.lastElementChild.dataset.when !== label) {
      const group = document.createElement("li");
      group.className = "places-group";
      group.dataset.when = label;
      if (label) {
        const h = document.createElement("h3");
        h.className = "places-when";
        h.textContent = label;
        group.appendChild(h);
      }
      const ul = document.createElement("ul");
      ul.setAttribute("aria-label", label || "Other places");
      group.appendChild(ul);
      placesEl.appendChild(group);
    }
    placesEl.lastElementChild.querySelector("ul").appendChild(li);
    rowEls.push(li);
  });
  activateTrip(0);

  // On wide screens the list scrolls inside its own column (the page and the
  // preview stay put), fading at whichever edge has more above or below.
  function updateListFades() {
    const top = placesEl.scrollTop, rest = placesEl.scrollHeight - placesEl.clientHeight - top;
    placesEl.style.setProperty("--fade-top", top > 1 ? "var(--s4)" : "0px");
    placesEl.style.setProperty("--fade-bottom", rest > 1 ? "var(--s4)" : "0px");
  }
  placesEl.addEventListener("scroll", updateListFades, { passive: true });
  new ResizeObserver(updateListFades).observe(placesEl);
  updateListFades();
  // Bring a place's row into the middle of the list without moving the page.
  function revealRow(ti) {
    const row = rowEls[ti];
    if (!row || placesEl.scrollHeight <= placesEl.clientHeight) return;
    const target = row.offsetTop - (placesEl.clientHeight - row.offsetHeight) / 2;
    placesEl.scrollTo({ top: Math.max(0, target), behavior: reduceMotion ? "auto" : "smooth" });
  }
  // Is this wheel event over a list that can still scroll that way? Then the
  // list takes it, not the page and not the scene switch.
  function listCanTake(e) {
    if (!placesEl.contains(e.target) || placesEl.scrollHeight <= placesEl.clientHeight + 1) return false;
    if (e.deltaY < 0) return placesEl.scrollTop > 0;
    if (e.deltaY > 0) return placesEl.scrollTop + placesEl.clientHeight < placesEl.scrollHeight - 1;
    return false;
  }

  // ================= Menu =================
  const menu = document.getElementById("menu");
  const menuBtn = document.getElementById("menu-btn");
  const setMenu = (open) => { menu.classList.toggle("is-open", open); menuBtn.setAttribute("aria-expanded", String(open)); };
  menuBtn.addEventListener("click", () => setMenu(!menu.classList.contains("is-open")));
  menu.addEventListener("mouseenter", () => menuBtn.setAttribute("aria-expanded", "true"));
  menu.addEventListener("mouseleave", () => setMenu(false));
  menu.querySelectorAll(".menu-links a").forEach((a) => a.addEventListener("click", () => { setMenu(false); a.blur(); }));
  document.addEventListener("click", (e) => { if (!menu.contains(e.target)) setMenu(false); });

  // ================= Scenes: globe → photos =================
  // Wide screens only. The globe and the photos are two scenes over a sky
  // that never moves. Going to the photos, the globe lifts straight up and
  // out (accelerating, like it's being drawn away); the sky holds empty for
  // a beat; then the photos rise in from below and settle. Coming back runs
  // the same idea in reverse. One wheel gesture, swipe, key or link triggers
  // the whole sequence, and the gesture that triggered it is used up, so a
  // trackpad's momentum tail can't immediately bounce you back.
  const scenes = (() => {
    const root = document.documentElement;
    const wide = matchMedia("(min-width: 861px)");
    const heroEl = document.getElementById("top");
    const photoEls = [...document.querySelectorAll(".scene-photos")];
    const pinsEl = document.getElementById("pins");
    const lbEl = document.getElementById("lightbox");
    const EASE_RECEDE = "cubic-bezier(0.55, 0, 0.2, 1)";   // a camera-like move: eases off the mark, glides, settles
    const EASE_ARRIVE_SOFT = "cubic-bezier(0.22, 1, 0.36, 1)"; // the photos drift forward and come to rest
    let scene = null, busy = false, anims = [], gen = 0;
    let gestureAt = 0, gestureY = 0, gestureSum = 0, spent = false, listAt = -1e9;

    const active = () => wide.matches;
    const setScene = (name) => {
      scene = name;
      root.dataset.scene = name;
      heroEl.inert = name !== "globe";
      photoEls.forEach((el) => { el.inert = name !== "photos"; });
    };
    const play = (els, keyframes, options) => {
      const list = els.map((el) => el.animate(keyframes, { ...options, fill: "both" }));
      anims.push(...list);
      return Promise.all(list.map((a) => a.finished.catch(() => {})));
    };
    const clearAnims = () => { anims.forEach((a) => a.cancel()); anims = []; };
    const moveFocus = (from, to) => {
      if (from.some((el) => el.contains(document.activeElement))) to.focus({ preventScroll: true });
    };

    async function go(target) {
      if (!active() || busy || scene === target) return;
      busy = true;
      const my = ++gen;
      const stale = () => my !== gen; // a resize to the phone layout cancelled this run
      const toPhotos = target === "photos";
      const out = toPhotos ? [heroEl] : photoEls;
      const into = toPhotos ? photoEls : [heroEl];
      setScene(toPhotos ? "to-photos" : "to-globe");
      if (toPhotos) scrollTo({ top: 0, behavior: "instant" });
      if (reduceMotion) {
        // No travel. To the photos: the globe fades out of the middle, then
        // the photos fade in with the globe faint in its corner. Back: the
        // photos and the faint globe fade out, then the globe fades in whole.
        const faint = +getComputedStyle(root).getPropertyValue("--globe-away-opacity");
        if (toPhotos) {
          await play([heroEl], [{ opacity: 1 }, { opacity: 0 }], { duration: 240, easing: "ease-out" });
          if (stale()) return;
          setScene("to-photos-in");
          await Promise.all([
            play(photoEls, [{ opacity: 0 }, { opacity: 1 }], { duration: 320, easing: "ease-out" }),
            play([heroEl], [{ opacity: 0 }, { opacity: faint }], { duration: 320, easing: "ease-out" }),
          ]);
        } else {
          await Promise.all([
            play(photoEls, [{ opacity: 1 }, { opacity: 0 }], { duration: 240, easing: "ease-out" }),
            play([heroEl], [{ opacity: faint }, { opacity: 0 }], { duration: 240, easing: "ease-out" }),
          ]);
          if (stale()) return;
          setScene("to-globe-in");
          await play([heroEl], [{ opacity: 0 }, { opacity: 1 }], { duration: 320, easing: "ease-out" });
        }
      } else if (toPhotos) {
        // The globe pushes back into the far corner of the sky, and the
        // photos come forward out of that depth while it is still settling:
        // one continuous move, not two.
        const away = getComputedStyle(root).getPropertyValue("--globe-away").trim();
        const awayOpacity = getComputedStyle(root).getPropertyValue("--globe-away-opacity").trim();
        await Promise.all([
          play([pinsEl], [{ opacity: 1 }, { opacity: 0 }], { duration: 260, easing: "ease-out" }),
          play(out, [
            { transform: "translate3d(0,0,0) scale(1)", opacity: 1 },
            { transform: away, opacity: awayOpacity },
          ], { duration: 1150, easing: EASE_RECEDE }),
          play(into, [
            { transform: "scale(0.94)", opacity: 0 },
            { transform: "scale(1)", opacity: 1 },
          ], { duration: 900, delay: 420, easing: EASE_ARRIVE_SOFT }),
        ]);
      } else {
        // Reverse: the photos sink back into the distance, and the globe
        // comes forward out of its corner to the middle of the sky.
        const away = getComputedStyle(root).getPropertyValue("--globe-away").trim();
        const awayOpacity = getComputedStyle(root).getPropertyValue("--globe-away-opacity").trim();
        await Promise.all([
          play(out, [
            { transform: "scale(1)", opacity: 1 },
            { transform: "scale(0.95)", opacity: 0 },
          ], { duration: 480, easing: "cubic-bezier(0.4, 0, 1, 1)" }),
          play(into, [
            { transform: away, opacity: awayOpacity },
            { transform: "translate3d(0,0,0) scale(1)", opacity: 1 },
          ], { duration: 1150, delay: 200, easing: EASE_RECEDE }),
          play([pinsEl], [{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: 1050, easing: "ease-out" }),
        ]);
      }
      if (stale()) return;
      setScene(target);
      clearAnims();
      moveFocus(out, toPhotos ? document.querySelector(".places-col h2") : document.getElementById("globe"));
      busy = false;
      spent = true; // the rest of this gesture is used up
    }

    // Wheel: registered before the page-scroll spring, so whatever this
    // claims (preventDefault) the spring leaves alone. The globe's own
    // handler runs earlier still and claims scrolls over the globe itself.
    addEventListener("wheel", (e) => {
      if (!active() || e.ctrlKey || lbEl.classList.contains("is-open")) return;
      const now = performance.now();
      if (now - gestureAt > 220) { gestureY = scrollY; gestureSum = 0; spent = false; }
      gestureAt = now;
      if (e.defaultPrevented) return;
      // The place list scrolls on its own; while it's moving (and for a moment
      // after it hits the top), scrolling up can't send you back to the globe.
      if (scene === "photos" && !busy && !spent && listCanTake(e)) { gestureY = Infinity; listAt = now; return; }
      // Still scrolling right after the list stopped (it hit its top): keep
      // holding until there's a short pause, so a mouse wheel's next few
      // notches don't fling you back to the globe.
      if (scene === "photos" && now - listAt < 450) { listAt = now; e.preventDefault(); return; }
      const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
      const dy = Math.abs(e.deltaY) >= Math.abs(e.deltaX) ? e.deltaY * unit : 0;
      // The globe scene never scrolls, and neither does the tail of the
      // gesture that just switched scenes.
      if (busy || spent || scene !== "photos") e.preventDefault();
      if (busy || spent || !dy) return;
      gestureSum += dy;
      if (scene === "globe" && gestureSum > 30) go("photos");
      // Back up only from a gesture that began at the top, not one that
      // glided up into it.
      else if (scene === "photos" && gestureY <= 1 && scrollY <= 1 && gestureSum < -60) { e.preventDefault(); go("globe"); }
    }, { passive: false });

    // Touch on a wide screen (tablets): a swipe up or down does the same.
    let touchY = null, touchTop = false;
    addEventListener("touchstart", (e) => { touchY = e.touches[0].clientY; touchTop = scrollY <= 1; }, { passive: true });
    addEventListener("touchmove", (e) => {
      if (!active() || touchY === null || lbEl.classList.contains("is-open")) return;
      const dy = e.touches[0].clientY - touchY;
      if (scene === "globe" && dy < -50) { touchY = null; go("photos"); }
      else if (scene === "photos" && touchTop && dy > 70) { touchY = null; go("globe"); }
    }, { passive: true });

    addEventListener("keydown", (e) => {
      if (!active() || busy || lbEl.classList.contains("is-open") || e.metaKey || e.ctrlKey || e.altKey) return;
      const t = e.target;
      if (t.matches && t.matches("input, textarea, select, [contenteditable]")) return;
      if (e.key === " " && t.matches && t.matches("button, a")) return;
      if (scene === "globe" && ["PageDown", "ArrowDown", " ", "End"].includes(e.key)) { e.preventDefault(); go("photos"); }
      else if (scene === "photos" && scrollY <= 1 && ["PageUp", "ArrowUp", "Home"].includes(e.key)) { e.preventDefault(); go("globe"); }
    });

    // Links: anything pointing into the photos goes there; "#top" comes back.
    document.addEventListener("click", (e) => {
      const a = e.target.closest && e.target.closest('a[href^="#"]');
      if (!a || !active()) return;
      const id = a.getAttribute("href").slice(1);
      const dest = id && document.getElementById(id);
      if (id === "top") { e.preventDefault(); go("globe"); }
      else if (dest && photoEls.some((el) => el.contains(dest))) { e.preventDefault(); go("photos"); }
    });

    function reset() {
      gen++; clearAnims(); busy = false;
      if (active()) {
        const start = location.hash && document.getElementById(location.hash.slice(1));
        setScene(start && photoEls.some((el) => el.contains(start)) ? "photos" : "globe");
        if (scene === "globe") scrollTo({ top: 0, behavior: "instant" });
      } else {
        scene = null;
        delete root.dataset.scene;
        heroEl.inert = false;
        photoEls.forEach((el) => { el.inert = false; });
      }
    }
    wide.addEventListener("change", reset);
    reset();
    return { go, active, get scene() { return scene; } };
  })();

  // The slim scrollbar drawn over the sky on wide screens (the native one is
  // hidden there; see the CSS). It only appears once the photos have landed,
  // fading in after the motion stops, and only if there's anything to scroll.
  // Drag the thumb, or click above or below it to page.
  {
    const bar = document.getElementById("scrollbar");
    const thumb = document.getElementById("scrollbar-thumb");
    let thumbH = 0, trackH = 0, showTimer = 0, drag = null;
    const range = () => document.documentElement.scrollHeight - innerHeight;
    function measure() {
      const on = scenes.active() && scenes.scene === "photos" && range() > 1;
      clearTimeout(showTimer);
      if (on && !bar.classList.contains("is-on")) showTimer = setTimeout(() => bar.classList.add("is-on"), 180);
      if (!on) bar.classList.remove("is-on");
      trackH = bar.clientHeight;
      const docH = document.documentElement.scrollHeight;
      thumbH = Math.max(40, trackH * innerHeight / docH);
      thumb.style.height = `${thumbH}px`;
      place();
    }
    function place() {
      const r = range();
      const y = r > 0 ? (scrollY / r) * (trackH - thumbH) : 0;
      thumb.style.transform = `translate3d(0, ${y.toFixed(1)}px, 0)`;
    }
    addEventListener("scroll", place, { passive: true });
    addEventListener("resize", measure);
    new ResizeObserver(measure).observe(document.body);
    new MutationObserver(measure).observe(document.documentElement, { attributes: true, attributeFilter: ["data-scene"] });
    thumb.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      thumb.setPointerCapture(e.pointerId);
      drag = { y: e.clientY, top: scrollY };
      bar.classList.add("is-dragging");
    });
    thumb.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const per = range() / Math.max(1, trackH - thumbH);
      scrollTo({ top: drag.top + (e.clientY - drag.y) * per, behavior: "instant" });
    });
    const endDrag = () => { drag = null; bar.classList.remove("is-dragging"); };
    thumb.addEventListener("pointerup", endDrag);
    thumb.addEventListener("pointercancel", endDrag);
    bar.addEventListener("pointerdown", (e) => {
      if (e.target !== bar) return;
      const below = e.clientY > thumb.getBoundingClientRect().bottom;
      scrollBy({ top: (below ? 1 : -1) * innerHeight * 0.9, behavior: reduceMotion ? "auto" : "smooth" });
    });
    measure();
  }

  // ================= Page scroll feel =================
  // The same slow, gliding wheel scroll the old photo gallery had: each wheel
  // step moves a target, and a damped spring eases the page toward it, so
  // motion builds from rest and settles back to rest instead of jumping.
  // The globe's own wheel handler runs first and claims scrolls over the
  // globe; everything else lands here. Touch, keyboard and links scroll
  // natively, and reduced-motion users get the browser's plain scrolling.
  if (!reduceMotion) {
    // Critically damped for this integrator at k = 0.045 (no overshoot while
    // d <= ~0.681), so the glide stops without springing back.
    const SPRING_STIFFNESS = 0.045; // pull toward target per frame
    const SPRING_DAMPING = 0.67;    // velocity retained per frame
    const SETTLE_EPSILON = 0.25;    // px — below this the motion is imperceptible
    const EDGE_SOFT_ZONE = 420;     // px over which input tapers near the top/bottom
    const maxY = () => document.documentElement.scrollHeight - innerHeight;
    // The float position is the source of truth: scrollY rounds to whole
    // pixels, which would lose sub-pixel steps and never let the loop settle.
    let current = scrollY, target = scrollY, velocity = 0, rafId = null, lastWritten = scrollY;

    function tick() {
      const dist = target - current;
      const v = (velocity + dist * SPRING_STIFFNESS) * SPRING_DAMPING;
      if (Math.abs(dist) < SETTLE_EPSILON && Math.abs(v) < SETTLE_EPSILON) {
        current = target; velocity = 0; rafId = null;
      } else {
        current += v; velocity = v;
        rafId = requestAnimationFrame(tick);
      }
      // "instant", or the stylesheet's smooth scroll-behavior would animate
      // every single frame of the spring on top of itself.
      scrollTo({ top: current, behavior: "instant" });
      lastWritten = scrollY;
    }
    function taperedTarget(delta) {
      const max = maxY();
      if (max <= 0) return target;
      const down = delta > 0;
      if ((down && target >= max - 0.5) || (!down && target <= 0.5)) return target;
      const remaining = down ? max - target : target;
      const taper = remaining < EDGE_SOFT_ZONE ? Math.max(0.12, remaining / EDGE_SOFT_ZONE) : 1;
      return clamp(target + delta * taper, 0, max);
    }

    addEventListener("wheel", (e) => {
      // Already handled (the globe), a pinch-zoom, or the lightbox — leave it.
      if (e.defaultPrevented || e.ctrlKey || document.getElementById("lightbox").classList.contains("is-open")) return;
      if (Math.abs(e.deltaY) < Math.abs(e.deltaX)) return; // sideways: nothing to scroll
      if (listCanTake(e)) return; // the place list scrolls on its own
      e.preventDefault();
      if (rafId === null) { current = target = scrollY; velocity = 0; }
      const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? innerHeight : 1;
      target = taperedTarget(e.deltaY * unit);
      if (rafId === null) rafId = requestAnimationFrame(tick);
    }, { passive: false });

    // Stand down for touch, so the spring doesn't fight native momentum.
    addEventListener("touchstart", () => {
      if (rafId !== null) cancelAnimationFrame(rafId);
      rafId = null; velocity = 0; current = target = scrollY;
    }, { passive: true });
    // Keep in step when the page moves some other way (keys, links, the
    // "Fly there" buttons, the scrollbar). If that happens mid-glide, the
    // other movement wins and the glide is dropped.
    addEventListener("scroll", () => {
      if (Math.abs(scrollY - lastWritten) < 2) return; // our own write
      if (rafId !== null) cancelAnimationFrame(rafId);
      rafId = null; velocity = 0; current = target = scrollY;
    }, { passive: true });
  }

  // ================= Renderer =================
  const hero = document.getElementById("top");

  const stage = document.getElementById("stage");
  const canvas = document.getElementById("globe");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);

  // ================= Globe: data =================
  // Land outline (for which faces are land) and a coarse world elevation
  // grid (for how high each one stands, and how deep the sea is).
  const [land, elevAt] = await Promise.all([
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-110m.json")
      .then((r) => r.json())
      .then((w) => topojson.feature(w, w.objects.land))
      .catch(() => null),
    loadWorldElevation().catch(() => null),
  ]);

  const MW = 2048, MH = 1024;
  const mask = (() => {
    const c = document.createElement("canvas");
    c.width = MW; c.height = MH;
    const x = c.getContext("2d", { willReadFrequently: true });
    x.fillStyle = "#000"; x.fillRect(0, 0, MW, MH);
    if (land) {
      const proj = d3.geoEquirectangular().scale(MW / (2 * Math.PI)).translate([MW / 2, MH / 2]);
      x.fillStyle = "#fff"; x.beginPath(); d3.geoPath(proj, x)(land); x.fill();
    }
    return x.getImageData(0, 0, MW, MH).data;
  })();
  const isLand = (lat, lng) => {
    const px = clamp(Math.floor(((lng + 180) / 360) * MW), 0, MW - 1);
    const py = clamp(Math.floor(((90 - lat) / 180) * MH), 0, MH - 1);
    return mask[(py * MW + px) * 4] > 127;
  };
  const elev = (lat, lng) => (elevAt ? elevAt(lat, lng) : isLand(lat, lng) ? 400 : -2500);

  async function loadWorldElevation() {
    const z = 2, n = 4, T = 256, W = n * T;
    const c = document.createElement("canvas");
    c.width = W; c.height = W;
    const x = c.getContext("2d", { willReadFrequently: true });
    const jobs = [];
    for (let ty = 0; ty < n; ty++) for (let tx = 0; tx < n; tx++) {
      jobs.push(loadImg(`https://elevation-tiles-prod.s3.amazonaws.com/terrarium/${z}/${tx}/${ty}.png`).then((im) => x.drawImage(im, tx * T, ty * T)));
    }
    await Promise.all(jobs);
    const d = x.getImageData(0, 0, W, W).data;
    const e = new Float32Array(W * W);
    for (let i = 0; i < e.length; i++) e[i] = d[i * 4] * 256 + d[i * 4 + 1] + d[i * 4 + 2] / 256 - 32768;
    return (lat, lng) => {
      const la = clamp(lat, -85, 85) * D2R;
      const px = clamp(Math.floor(((lng + 180) / 360) * W), 0, W - 1);
      const py = clamp(Math.floor(((1 - Math.log(Math.tan(Math.PI / 4 + la / 2)) / Math.PI) / 2) * W), 0, W - 1);
      return e[py * W + px];
    };
  }

  // How far from the centre the ground sits: sea at 1, land raised and
  // mountains exaggerated so the ranges read as faceted ridges.
  function surfaceR(lat, lng) {
    if (!isLand(lat, lng)) return 1;
    const e = Math.max(0, elev(lat, lng));
    return 1.012 + 0.1 * Math.pow(Math.min(1, e / 7000), 0.75);
  }
  const isDesert = (lat, lng) =>
    (lat > 15 && lat < 32 && lng > -17 && lng < 58) ||
    (lat > -31 && lat < -19 && lng > 118 && lng < 142) ||
    (lat > 36 && lat < 46 && lng > 78 && lng < 112) ||
    (lat > -28 && lat < -18 && lng > 13 && lng < 22) ||
    (lat > 25 && lat < 36 && lng > -117 && lng < -104);

  const UP = new THREE.Vector3(0, 1, 0);
  const dirFrom = (lat, lng, out = new THREE.Vector3()) =>
    out.set(Math.cos(lat * D2R) * Math.sin(lng * D2R), Math.sin(lat * D2R), Math.cos(lat * D2R) * Math.cos(lng * D2R));
  const latLngOf = (v) => [Math.asin(clamp(v.y, -1, 1)) / D2R, Math.atan2(v.x, v.z) / D2R];

  // ================= Globe: scene =================
  const globeScene = new THREE.Scene();
  const globeCam = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
  globeScene.add(new THREE.HemisphereLight(0xeef3f2, 0x7d8b6c, 1.9));
  const sun = new THREE.DirectionalLight(0xfff4e6, 2.1);
  sun.position.set(-3, 3.2, 4);
  globeScene.add(sun);

  // Atmosphere: a soft glacier-coloured halo behind the globe.
  {
    const c = document.createElement("canvas");
    c.width = c.height = 256;
    const x = c.getContext("2d");
    const g = x.createRadialGradient(128, 128, 0, 128, 128, 128);
    g.addColorStop(0, "rgba(170, 205, 202, 0.75)");
    g.addColorStop(0.72, "rgba(176, 206, 204, 0.55)");
    g.addColorStop(0.82, "rgba(205, 220, 230, 0.22)");
    g.addColorStop(1, "rgba(223, 212, 226, 0)");
    x.fillStyle = g; x.fillRect(0, 0, 256, 256);
    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false, transparent: true }));
    halo.scale.setScalar(2.95);
    halo.renderOrder = -1;
    globeScene.add(halo);
  }

  const globe = new THREE.Group();
  globeScene.add(globe);

  const C = (hex) => new THREE.Color(hex);
  const PAL = {
    shallow: C(0xa3cfc8), deep: C(0x76a8aa),
    snow: C(0xf0f2ec), rock: C(0xa59d8c), sand: C(0xd8c9a0), tundra: C(0xadb894),
    greens: [C(0x93ab74), C(0x83a068), C(0x9fb57f), C(0xaabd88), C(0x7f9a6a)],
  };

  // The planet: a finely split icosahedron, every face one flat colour.
  {
    const geo = new THREE.IcosahedronGeometry(1, 56);
    const pos = geo.attributes.position;
    const v = new THREE.Vector3();
    const base = new Float32Array(pos.count * 3); // undisplaced directions, for face colours
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i).normalize();
      base.set([v.x, v.y, v.z], i * 3);
      const [la, ln] = latLngOf(v);
      v.multiplyScalar(surfaceR(la, ln));
      pos.setXYZ(i, v.x, v.y, v.z);
    }
    const colors = new Float32Array(pos.count * 3);
    const rng = makeRng(7);
    const col = new THREE.Color();
    for (let f = 0; f < pos.count; f += 3) {
      v.set(0, 0, 0);
      for (let k = 0; k < 3; k++) v.x += base[(f + k) * 3], v.y += base[(f + k) * 3 + 1], v.z += base[(f + k) * 3 + 2];
      v.normalize();
      const [la, ln] = latLngOf(v);
      const e = elev(la, ln);
      if (!isLand(la, ln)) {
        // Stepped depth bands read as calm, terraced water.
        col.copy(e > -220 ? PAL.shallow : PAL.deep).offsetHSL(0, 0, (rng() - 0.5) * 0.025);
        for (let k = 0; k < 3; k++) colors.set([col.r, col.g, col.b], (f + k) * 3);
        continue;
      } else if (la < -60 || la > 70 || e > 3600) col.copy(PAL.snow);
      else if (e > 2100) col.copy(PAL.rock);
      else if (isDesert(la, ln)) col.copy(PAL.sand);
      else if (la > 58) col.copy(PAL.tundra);
      else col.copy(PAL.greens[Math.floor(rng() * PAL.greens.length)]);
      col.offsetHSL(0, 0, (rng() - 0.5) * 0.04);
      for (let k = 0; k < 3; k++) colors.set([col.r, col.g, col.b], (f + k) * 3);
    }
    geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
    geo.computeVertexNormals();
    globe.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95, metalness: 0 })));
  }

  // ---- Low-poly props: built from primitives, merged, coloured per part ----
  function part(g, color, m) {
    g = g.index ? g.toNonIndexed() : g;
    g.deleteAttribute("uv");
    if (m) g.applyMatrix4(m);
    const c = new THREE.Color(color);
    const arr = new Float32Array(g.attributes.position.count * 3);
    for (let i = 0; i < arr.length; i += 3) arr.set([c.r, c.g, c.b], i);
    g.setAttribute("color", new THREE.BufferAttribute(arr, 3));
    return g;
  }
  const M = (x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = sx, sz = sx) =>
    new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(sx, sy, sz));
  const ico = (r, d = 0) => new THREE.IcosahedronGeometry(r, d);
  const box = (w, h, d) => new THREE.BoxGeometry(w, h, d);
  const cone = (r, h, s = 6) => new THREE.ConeGeometry(r, h, s);
  const cyl = (r1, r2, h, s = 6) => new THREE.CylinderGeometry(r1, r2, h, s);
  const propMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.9, metalness: 0 });

  const TRUNK = 0x7a6450;
  const GEO = {
    pine: mergeGeometries([
      part(cyl(0.07, 0.09, 0.32, 5), TRUNK, M(0, 0.16)),
      part(cone(0.4, 0.62), 0x5f7f5a, M(0, 0.58)),
      part(cone(0.31, 0.52), 0x6b8b62, M(0, 0.9)),
      part(cone(0.2, 0.42), 0x799870, M(0, 1.18)),
    ]),
    round: mergeGeometries([
      part(cyl(0.07, 0.1, 0.5, 5), TRUNK, M(0, 0.25)),
      part(ico(0.42), 0x86a565, M(0, 0.78)),
      part(ico(0.28), 0x97b373, M(0.22, 0.98, 0.05)),
    ]),
    peak: mergeGeometries([
      part(cone(0.55, 1.1, 5), 0x9d9586, M(0, 0.55)),
      part(cone(0.24, 0.46, 5), 0xf1f2ee, M(0, 0.89)),
    ]),
    rock: mergeGeometries([part(ico(0.4), 0xa8a395, M(0, 0.12, 0, 0, 0, 0, 1, 0.6, 1))]),
  };
  const ANIMAL = {
    elk: () => mergeGeometries([
      part(box(1.0, 0.42, 0.38), 0x8c6f56, M(0, 0.78)),
      ...[[-0.38, -0.12], [-0.38, 0.12], [0.36, -0.12], [0.36, 0.12]].map(([x, z]) => part(box(0.1, 0.58, 0.1), 0x6e5744, M(x, 0.29, z))),
      part(box(0.22, 0.5, 0.22), 0x7a604a, M(0.52, 1.05, 0, 0, 0, -0.55)),
      part(box(0.36, 0.2, 0.2), 0x7a604a, M(0.74, 1.27)),
      ...[-0.1, 0.1].flatMap((z) => [
        part(box(0.05, 0.42, 0.05), 0xe1d4bb, M(0.62, 1.55, z, z * 3, 0, 0.35)),
        part(box(0.05, 0.22, 0.05), 0xe1d4bb, M(0.72, 1.62, z * 1.6, z * 4, 0, -0.5)),
        part(box(0.05, 0.2, 0.05), 0xe1d4bb, M(0.52, 1.7, z * 1.8, z * 4, 0, 0.9)),
      ]),
    ]),
    panda: () => mergeGeometries([
      part(ico(0.46, 1), 0xf2f1ea, M(0, 0.55, 0, 0, 0, 0, 1.15, 0.9, 0.9)),
      part(box(0.5, 0.3, 0.5), 0x3a3d3c, M(0.05, 0.62)),
      ...[[-0.3, -0.2], [-0.3, 0.2], [0.3, -0.2], [0.3, 0.2]].map(([x, z]) => part(box(0.18, 0.36, 0.18), 0x3a3d3c, M(x, 0.18, z))),
      part(ico(0.3, 1), 0xf2f1ea, M(0.58, 0.85)),
      part(ico(0.1), 0x3a3d3c, M(0.55, 1.12, -0.18)),
      part(ico(0.1), 0x3a3d3c, M(0.55, 1.12, 0.18)),
      part(ico(0.07), 0x3a3d3c, M(0.83, 0.9, -0.1)),
      part(ico(0.07), 0x3a3d3c, M(0.83, 0.9, 0.1)),
    ]),
    elephant: () => mergeGeometries([
      part(ico(0.55, 1), 0x9a9d99, M(0, 0.85, 0, 0, 0, 0, 1.3, 0.9, 0.9)),
      ...[[-0.38, -0.22], [-0.38, 0.22], [0.38, -0.22], [0.38, 0.22]].map(([x, z]) => part(cyl(0.13, 0.13, 0.62), 0x8e918d, M(x, 0.31, z))),
      part(ico(0.33, 1), 0x9a9d99, M(0.78, 1.0)),
      part(box(0.05, 0.48, 0.42), 0x8a8d89, M(0.68, 1.02, -0.32, 0.3)),
      part(box(0.05, 0.48, 0.42), 0x8a8d89, M(0.68, 1.02, 0.32, -0.3)),
      part(cyl(0.06, 0.12, 0.6), 0x939692, M(1.02, 0.66, 0, 0, 0, 0.25)),
      part(cone(0.04, 0.28, 4), 0xf1ede2, M(0.98, 0.8, -0.12, 0, 0, -2.2)),
      part(cone(0.04, 0.28, 4), 0xf1ede2, M(0.98, 0.8, 0.12, 0, 0, -2.2)),
    ]),
    giraffe: () => mergeGeometries([
      part(box(0.8, 0.38, 0.34), 0xd8b47a, M(0, 1.05)),
      ...[[-0.3, -0.11], [-0.3, 0.11], [0.3, -0.11], [0.3, 0.11]].map(([x, z]) => part(box(0.08, 0.9, 0.08), 0xc9a368, M(x, 0.45, z))),
      part(box(0.15, 0.95, 0.15), 0xd8b47a, M(0.45, 1.6, 0, 0, 0, -0.35)),
      part(box(0.34, 0.16, 0.16), 0xc9a368, M(0.68, 2.08)),
      part(box(0.04, 0.14, 0.04), 0x7a6450, M(0.6, 2.22, -0.05)),
      part(box(0.04, 0.14, 0.04), 0x7a6450, M(0.6, 2.22, 0.05)),
      ...[[-0.2, 1.18, 0.18], [0.15, 1.12, 0.18], [0.0, 1.0, -0.18], [0.5, 1.6, 0.08]].map(([x, y, z]) => part(box(0.14, 0.12, 0.02), 0x9b7651, M(x, y, z))),
    ]),
    kangaroo: () => mergeGeometries([
      part(ico(0.34, 1), 0xb98b63, M(0, 0.6, 0, 0, 0, -0.5, 1, 1.35, 0.85)),
      part(ico(0.18, 1), 0xb98b63, M(0.3, 1.08)),
      part(cone(0.06, 0.22, 4), 0xa47a55, M(0.26, 1.3, -0.08)),
      part(cone(0.06, 0.22, 4), 0xa47a55, M(0.26, 1.3, 0.08)),
      part(cyl(0.03, 0.1, 0.8, 5), 0xa47a55, M(-0.42, 0.3, 0, 0, 0, 1.0)),
      part(box(0.42, 0.1, 0.12), 0xa47a55, M(0.08, 0.08, -0.12)),
      part(box(0.42, 0.1, 0.12), 0xa47a55, M(0.08, 0.08, 0.12)),
    ]),
    penguin: () => mergeGeometries([
      part(ico(0.3, 1), 0x35403f, M(0, 0.48, 0, 0, 0, 0, 1, 1.55, 1)),
      part(ico(0.22, 1), 0xf3f3ef, M(0.13, 0.44, 0, 0, 0, 0, 0.8, 1.4, 1)),
      part(ico(0.19, 1), 0x35403f, M(0, 0.98)),
      part(cone(0.06, 0.18, 4), 0xe0a65a, M(0.22, 0.96, 0, 0, 0, -Math.PI / 2)),
    ]),
    whale: () => mergeGeometries([
      part(ico(0.5, 1), 0x56737a, M(0, 0.06, 0, 0, 0, 0, 2.0, 0.62, 0.8)),
      part(box(0.3, 0.05, 0.5), 0x4c676e, M(-1.05, 0.22, -0.2, 0, -0.5, 0.4)),
      part(box(0.3, 0.05, 0.5), 0x4c676e, M(-1.05, 0.22, 0.2, 0, 0.5, 0.4)),
      part(cyl(0.02, 0.07, 0.35, 5), 0xeaf3f2, M(0.55, 0.45)),
      part(ico(0.09), 0xeaf3f2, M(0.55, 0.66)),
    ]),
  };

  // Places a unit-space prop on the ground at (lat, lng), standing upright.
  function surfaceMatrix(lat, lng, scale, yaw, lift = -0.004) {
    const n = dirFrom(lat, lng);
    const q = new THREE.Quaternion().setFromUnitVectors(UP, n).multiply(new THREE.Quaternion().setFromAxisAngle(UP, yaw));
    return new THREE.Matrix4().compose(n.clone().multiplyScalar(surfaceR(lat, lng) + lift), q, new THREE.Vector3(scale, scale, scale));
  }

  const pinned = trips.map((t, i) => ({ ...t, i })).filter((t) => t.pinned);
  const nearPin = (lat, lng) => pinned.some((p) => d3.geoDistance([lng, lat], [p.lng, p.lat]) < 0.06);

  {
    const rng = makeRng(42);
    const randPoint = () => [Math.asin(rng() * 2 - 1) / D2R, rng() * 360 - 180];
    const lists = { pine: [], round: [], peak: [], rock: [] };
    for (let tries = 0; tries < 60000; tries++) {
      const [la, ln] = randPoint();
      if (!isLand(la, ln) || nearPin(la, ln)) continue;
      const e = elev(la, ln);
      const cold = la < -58 || la > 68 || e > 3600;
      if (e > 2300 && !cold && lists.peak.length < 34) { lists.peak.push([la, ln, 0.05 + rng() * 0.03]); continue; }
      if (cold || isDesert(la, ln)) { if (rng() < 0.08 && lists.rock.length < 30 && !cold) lists.rock.push([la, ln, 0.03 + rng() * 0.02]); continue; }
      const boreal = Math.abs(la) > 42 || e > 900;
      const list = boreal ? lists.pine : lists.round;
      if (list.length < 150) list.push([la, ln, 0.05 + rng() * 0.04]);
      if (lists.pine.length >= 150 && lists.round.length >= 150 && lists.peak.length >= 34) break;
    }
    const tint = new THREE.Color();
    for (const [kind, list] of Object.entries(lists)) {
      if (!list.length) continue;
      const inst = new THREE.InstancedMesh(GEO[kind], propMat, list.length);
      list.forEach(([la, ln, s], i) => {
        inst.setMatrixAt(i, surfaceMatrix(la, ln, s, rng() * Math.PI * 2));
        inst.setColorAt(i, tint.setHSL(0, 0, 0.88 + rng() * 0.2));
      });
      globe.add(inst);
    }

    // A few animals, oversized so they read from orbit.
    const animals = [
      ["elk", 57, -122, 0.085], ["panda", 30.5, 104, 0.08], ["elephant", -2, 36, 0.085],
      ["giraffe", 7, 25, 0.07], ["kangaroo", -25, 134, 0.075],
      ["penguin", -73, 18, 0.06], ["penguin", -72.4, 21, 0.05],
      ["whale", 22, -150, 0.07], ["whale", -38, -22, 0.065],
    ];
    animals.forEach(([kind, la, ln, s]) => {
      const mesh = new THREE.Mesh(ANIMAL[kind](), propMat);
      const lift = kind === "whale" ? -0.012 : -0.004;
      mesh.applyMatrix4(kind === "whale"
        ? (() => { const n = dirFrom(la, ln); const q = new THREE.Quaternion().setFromUnitVectors(UP, n).multiply(new THREE.Quaternion().setFromAxisAngle(UP, rng() * 6.28)); return new THREE.Matrix4().compose(n.multiplyScalar(1 + lift), q, new THREE.Vector3(s, s, s)); })()
        : surfaceMatrix(la, ln, s, rng() * Math.PI * 2, lift));
      globe.add(mesh);
    });
  }

  // Clouds drift on their own shell, a little slower than the idle spin.
  const cloudShell = new THREE.Group();
  globe.add(cloudShell);
  {
    const rng = makeRng(9);
    const cloudMat = new THREE.MeshStandardMaterial({ color: 0xf7f9f8, flatShading: true, roughness: 1, transparent: true, opacity: 0.94 });
    for (let c = 0; c < 14; c++) {
      const la = (rng() * 2 - 1) * 60, ln = rng() * 360 - 180;
      const puffs = [];
      const count = 3 + Math.floor(rng() * 3);
      for (let k = 0; k < count; k++) {
        const r = 0.35 + rng() * 0.3;
        puffs.push(ico(r, 0).translate((k - count / 2) * 0.42 + rng() * 0.1, rng() * 0.15, (rng() - 0.5) * 0.4));
      }
      const mesh = new THREE.Mesh(mergeGeometries(puffs), cloudMat);
      const n = dirFrom(la, ln);
      mesh.position.copy(n).multiplyScalar(1.2 + rng() * 0.08);
      mesh.quaternion.setFromUnitVectors(UP, n).multiply(new THREE.Quaternion().setFromAxisAngle(UP, rng() * 6.28));
      mesh.scale.setScalar(0.06 + rng() * 0.03);
      mesh.scale.y *= 0.7;
      cloudShell.add(mesh);
    }
  }

  // Small flocks of birds circling the planet.
  const flocks = [];
  {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute([
      0, 0, -0.25, 0, 0, 0.2, -0.75, 0.12, 0.05,
      0, 0, -0.25, 0.75, 0.12, 0.05, 0, 0, 0.2,
    ], 3));
    g.computeVertexNormals();
    const birdMat = new THREE.MeshStandardMaterial({ color: 0x4f5c5b, side: THREE.DoubleSide, flatShading: true });
    const rng = makeRng(3);
    for (let f = 0; f < 3; f++) {
      const pivot = new THREE.Group();
      pivot.rotation.set(rng() * Math.PI, rng() * Math.PI, rng() * Math.PI);
      for (let b = 0; b < 4; b++) {
        const bird = new THREE.Mesh(g, birdMat);
        bird.position.set(1.3 + (rng() - 0.5) * 0.06, (rng() - 0.5) * 0.08, b * 0.07);
        bird.scale.setScalar(0.035);
        bird.userData.phase = rng() * 6.28;
        pivot.add(bird);
      }
      pivot.userData.speed = 0.00012 + rng() * 0.00008;
      globe.add(pivot);
      flocks.push(pivot);
    }
  }

  // ================= Globe: pins =================
  const pinLayer = document.getElementById("pins");
  const pinByTrip = new Map();

  // "globe view" from the photo list: turn the globe until that place faces
  // you, then the pin lifts twice so your eye lands on it.
  async function findOnGlobe(ti) {
    const trip = trips[ti], pin = pinByTrip.get(ti);
    if (!trip?.pinned) return;
    wheelX = wheelY = 0; velocity = 0;
    idleUntil = performance.now() + 6000;
    await animateView({ ...home, rotY: -trip.lng * D2R, rotX: clamp(trip.lat, -60, 60) * D2R }, 1500);
    if (!pin) return;
    pin.classList.remove("is-found");
    void pin.offsetWidth;
    pin.classList.add("is-found");
    setTimeout(() => pin.classList.remove("is-found"), 2400);
  }
  const pinEls = pinned.map((t) => {
    const b = document.createElement("button");
    b.className = "pin";
    b.innerHTML = `<span class="pin-base"></span><span class="pin-stem"></span><span class="pin-thumb"></span><span class="pin-label frost"></span>`;
    b.querySelector(".pin-label").textContent = t.name;
    b.querySelector(".pin-thumb").style.backgroundImage = `url("${encodeURI(t.photos[0].src)}")`;
    b.setAttribute("aria-label", `Open ${t.name}, ${countLabel(t.photos.length)}`);
    b.addEventListener("click", () => openFromPin(t.i, b));
    pinLayer.appendChild(b);
    pinByTrip.set(t.i, b);
    return { el: b, lat: t.lat, lng: t.lng };
  });
  (window.VISITED || []).forEach((v) => {
    const s = document.createElement("span");
    s.className = "pin-visited";
    s.title = v.name;
    pinLayer.appendChild(s);
    pinEls.push({ el: s, lat: v.lat, lng: v.lng });
  });

  // ================= Layout + camera =================
  let W = 1, H = 1;
  const view = { rotX: 0.4, rotY: 0, dist: 4, ox: 0, oy: 0 }; // current
  let home = { dist: 4, ox: 0, oy: 0 }; // overview framing for this screen size
  let globeRadiusPx = 1;
  {
    if (pinned.length) {
      const c = d3.geoCentroid({ type: "MultiPoint", coordinates: pinned.map((t) => [t.lng, t.lat]) });
      view.rotY = -c[0] * D2R;
      view.rotX = clamp(c[1], -30, 30) * D2R;
    }
  }
  const distFor = (rPx, h) => Math.sqrt(1 + Math.pow(h / 2 / (Math.tan(15 * D2R) * rPx), 2));
  function layout() {
    W = stage.clientWidth; H = stage.clientHeight;
    renderer.setSize(W, H, false);
    const narrow = innerWidth <= 860;
    let r, cx, cy;
    if (narrow) {
      r = Math.min(W * 0.4, H * 0.34);
      cx = W / 2; cy = H * 0.5;
    } else {
      r = Math.min(H * 0.36, W * 0.3);
      cx = W / 2; cy = H * 0.5;
    }
    home = { dist: distFor(r, H), ox: cx - W / 2, oy: cy - H / 2 };
    globeRadiusPx = r;
    if (!tween) Object.assign(view, home);
    globeCam.aspect = W / H;
  }
  function applyGlobeCamera() {
    globe.rotation.set(view.rotX, view.rotY, 0);
    globeCam.position.set(0, 0, view.dist);
    globeCam.lookAt(0, 0, 0);
    globeCam.setViewOffset(W, H, -view.ox, -view.oy, W, H);
    globeCam.updateProjectionMatrix();
  }

  const tmp = new THREE.Vector3(), tmpN = new THREE.Vector3(), camDir = new THREE.Vector3();
  function placePins() {
    pinEls.forEach(({ el, lat, lng }) => {
      dirFrom(lat, lng, tmpN).applyEuler(globe.rotation);
      tmp.copy(tmpN).multiplyScalar(surfaceR(lat, lng));
      camDir.copy(globeCam.position).sub(tmp).normalize();
      const facing = tmpN.dot(camDir);
      if (facing < 0.12) { el.style.opacity = 0; el.style.visibility = "hidden"; return; }
      tmp.project(globeCam);
      const x = (tmp.x * 0.5 + 0.5) * W, y = (-tmp.y * 0.5 + 0.5) * H;
      el.style.visibility = "visible";
      el.style.opacity = Math.min(1, (facing - 0.12) / 0.25).toFixed(3);
      el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
      el.classList.toggle("flip", x > W - 200);
    });
  }

  // ================= View tweens =================
  let tween = null;
  function animateView(to, dur) {
    return new Promise((resolve) => {
      const from = { ...view };
      if ("rotY" in to) {
        while (to.rotY - from.rotY > Math.PI) to.rotY -= Math.PI * 2;
        while (to.rotY - from.rotY < -Math.PI) to.rotY += Math.PI * 2;
      }
      tween = { from, to, start: performance.now(), dur: reduceMotion ? 1 : dur, resolve };
    });
  }

  // ---- Dragging the globe ----
  let dragging = false, velocity = 0, last = null, idleUntil = 0;
  const SPIN = reduceMotion ? 0 : 0.00006; // radians per ms
  canvas.addEventListener("pointerdown", (e) => {
    dragging = true; velocity = 0; wheelX = wheelY = 0;
    last = { x: e.clientX, y: e.clientY, t: performance.now() };
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add("is-dragging");
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const now = performance.now();
    const k = 0.0042 * (view.dist / 4); // radians per pixel
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    view.rotY += dx * k;
    view.rotX = clamp(view.rotX + dy * k, -1.1, 1.1);
    velocity = (dx * k) / Math.max(1, now - last.t);
    last = { x: e.clientX, y: e.clientY, t: now };
  });
  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove("is-dragging");
    idleUntil = performance.now() + 2500;
  };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  // ---- Scrolling over the globe spins it ----
  // Only while the pointer is over the globe itself (plus a little room for
  // the trees and clouds), so scrolling beside it still scrolls the page.
  // Scroll direction is the direction of travel: up/down tilts north/south,
  // left/right turns east/west, and a diagonal trackpad swipe does both.
  // Wheel steps are banked and paid out a little each frame, so a mouse
  // wheel's chunky steps turn into one smooth glide.
  let wheelX = 0, wheelY = 0;
  canvas.addEventListener("wheel", (e) => {
    const rect = canvas.getBoundingClientRect();
    const dx = e.clientX - rect.left - (W / 2 + view.ox);
    const dy = e.clientY - rect.top - (H / 2 + view.oy);
    if (Math.hypot(dx, dy) > globeRadiusPx * 1.12) return;
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? H : 1; // lines / pages → pixels
    wheelX += clamp(e.deltaX * unit, -240, 240) * 0.0035;
    wheelY += clamp(e.deltaY * unit, -240, 240) * 0.0035;
    velocity = 0;
    idleUntil = performance.now() + 2500;
  }, { passive: false });

  // ---- Render loop ----
  let prev = performance.now(), running = true;
  function frame(now) {
    const dt = Math.min(64, now - prev); prev = now;

    if (tween) {
      const p = Math.min(1, (now - tween.start) / tween.dur), e = ease(p);
      for (const k in tween.to) view[k] = tween.from[k] + (tween.to[k] - tween.from[k]) * e;
      if (p === 1) { const r = tween.resolve; tween = null; r(); }
    } else if (!dragging) {
      if (Math.abs(wheelX) > 0.0001 || Math.abs(wheelY) > 0.0001) {
        const k = 1 - Math.pow(0.86, dt / 16);
        const sx = wheelX * k, sy = wheelY * k;
        view.rotY -= sx; // scroll right → travel east
        view.rotX = clamp(view.rotX - sy, -1.1, 1.1); // scroll up → travel north
        wheelX -= sx; wheelY -= sy;
        // Stop banking tilt once it hits the limit, so it doesn't stick there.
        if (Math.abs(view.rotX) >= 1.1) wheelY = 0;
      } else if (Math.abs(velocity) > 0.00001) {
        view.rotY += velocity * dt;
        velocity *= Math.pow(0.94, dt / 16);
      } else if (now > idleUntil) {
        view.rotY += SPIN * dt;
      }
    }

    {
      if (!reduceMotion) {
        cloudShell.rotation.y += dt * 0.000035;
        flocks.forEach((f) => {
          f.rotation.y += f.userData.speed * dt;
          f.children.forEach((b) => { b.scale.y = 0.035 * (0.4 + Math.abs(Math.sin(now * 0.008 + b.userData.phase))); });
        });
      }
      applyGlobeCamera();
      renderer.render(globeScene, globeCam);
      placePins();
    }
    if (running) requestAnimationFrame(frame);
  }
  new IntersectionObserver(([entry]) => {
    const was = running;
    running = entry.isIntersecting;
    if (running && !was) { prev = performance.now(); requestAnimationFrame(frame); }
  }).observe(stage);

  layout();
  new ResizeObserver(layout).observe(stage);
  requestAnimationFrame(frame);
  requestAnimationFrame(() => {
    canvas.classList.add("is-ready");
    document.body.classList.add("is-loaded");
  });

  // ================= Lightbox =================
  const lb = document.getElementById("lightbox");
  const strip = document.getElementById("lb-strip");
  const lbPrev = document.getElementById("lb-prev");
  const lbNext = document.getElementById("lb-next");
  let lbIndex = 0, lbReturn = null;
  const behind = [document.getElementById("menu"), document.querySelector("main"), document.querySelector(".footer")];

  function setCurrent(i, scroll = true) {
    const imgs = strip.querySelectorAll("img");
    lbIndex = clamp(i, 0, imgs.length - 1);
    imgs.forEach((im, j) => im.classList.toggle("is-current", j === lbIndex));
    document.getElementById("lb-count").textContent = `${lbIndex + 1} of ${imgs.length}`;
    lbPrev.disabled = lbIndex === 0;
    lbNext.disabled = lbIndex === imgs.length - 1;
    if (scroll) imgs[lbIndex].scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", inline: "center", block: "nearest" });
  }
  function openLightbox(ti, pi, from) {
    const trip = trips[ti];
    lbReturn = from;
    document.getElementById("lb-name").textContent = trip.name;
    document.getElementById("lb-when").textContent = trip.when;
    strip.innerHTML = "";
    trip.photos.forEach((p, j) => {
      const im = document.createElement("img");
      im.src = p.src;
      im.width = p.w; im.height = p.h;
      im.decoding = "async";
      im.alt = `${trip.name}, photo ${j + 1} of ${trip.photos.length}`;
      im.addEventListener("click", () => setCurrent(j));
      strip.appendChild(im);
    });
    lb.inert = false;
    lb.classList.add("is-open");
    document.body.style.overflow = "hidden";
    // Everything behind the viewer is out of reach until it closes, so Tab
    // cycles through the viewer's own controls only.
    behind.forEach((el) => { el.dataset.wasInert = el.inert ? "1" : ""; el.inert = true; });
    requestAnimationFrame(() => {
      strip.querySelectorAll("img")[pi].scrollIntoView({ behavior: "auto", inline: "center", block: "nearest" });
      setCurrent(pi, false);
      document.getElementById("lb-close").focus();
    });
  }
  function closeLightbox() {
    closeIntoPin();
    lb.classList.remove("is-open");
    lb.inert = true;
    document.body.style.overflow = "";
    behind.forEach((el) => { el.inert = el.dataset.wasInert === "1"; });
    lbReturn?.focus({ preventScroll: true });
  }
  // ---- Pin → viewer ----
  // Clicking a pin opens that place's photos straight away. The pin's little
  // square photo grows into the full photo: a copy starts exactly over the
  // pin, cropped square like it, and opens its crop out to the whole picture
  // as it travels to where the viewer shows it. Closing on that same first
  // photo plays it in reverse, back into the pin.
  const MORPH = { duration: 1150, easing: "cubic-bezier(0.45, 0, 0.15, 1)" }; // eases in and out, so the growth reads as one slow, even move
  const PIN_PAUSE = 300; // the pin answers the click before the photo leaves it
  let lbPin = null, fwd = null;
  const frame2 = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  function morphFrames(thumbRect, photoRect) {
    const s = Math.min(photoRect.width, photoRect.height);
    const ix = (photoRect.width - s) / 2, iy = (photoRect.height - s) / 2;
    const k = thumbRect.width / s;
    const dx = thumbRect.left + thumbRect.width / 2 - (photoRect.left + photoRect.width / 2);
    const dy = thumbRect.top + thumbRect.height / 2 - (photoRect.top + photoRect.height / 2);
    return [
      { transform: `translate(${dx}px, ${dy}px) scale(${k})`, clipPath: `inset(${iy}px ${ix}px)` },
      { transform: "none", clipPath: "inset(0px 0px)" },
    ];
  }
  function makeGhost(img, rect) {
    const g = new Image();
    g.className = "lb-ghost";
    g.src = img.currentSrc || img.src;
    g.alt = "";
    Object.assign(g.style, { left: `${rect.left}px`, top: `${rect.top}px`, width: `${rect.width}px`, height: `${rect.height}px` });
    return g; // not on the page yet: it goes in with its animation, so it is never seen out of place
  }
  async function openFromPin(ti, pinBtn) {
    if (lb.classList.contains("is-open")) return;
    idleUntil = Infinity; // hold the globe still so the pin is there to return to
    velocity = 0; wheelX = wheelY = 0;
    const thumb = pinBtn.querySelector(".pin-thumb");
    lbPin = pinBtn;
    if (reduceMotion) { openLightbox(ti, 0, pinBtn); return; }
    pinBtn.classList.add("is-picked");
    await wait(PIN_PAUSE);
    if (lb.classList.contains("is-open")) { pinBtn.classList.remove("is-picked"); return; }
    lb.classList.add("is-morphing");
    openLightbox(ti, 0, pinBtn);
    await frame2(); // the viewer has laid out and centred the first photo
    const target = strip.querySelector("img.is-current");
    const from = thumb.getBoundingClientRect(), to = target.getBoundingClientRect();
    const ghost = makeGhost(target, to);
    await ghost.decode().catch(() => {}); // decoded off the page, so it is ready to draw on its first frame
    if (!lb.classList.contains("is-open")) { pinBtn.classList.remove("is-picked"); return; }
    document.body.appendChild(ghost);
    thumb.style.visibility = "hidden";
    pinBtn.classList.remove("is-picked");
    fwd = ghost.animate(morphFrames(from, to), { ...MORPH, fill: "forwards" });
    const ended = await fwd.finished.then(() => true, () => false);
    fwd = null;
    if (!ended) { ghost.remove(); return; } // closed mid-way; closeIntoPin took over
    // Hand off: show the real photo instantly beneath the copy, let it paint,
    // and only then lift the copy away.
    lb.classList.add("is-landing");
    lb.classList.remove("is-morphing");
    await frame2();
    ghost.remove();
    await frame2();
    lb.classList.remove("is-landing");
  }
  // Called by closeLightbox: returns true if it is handling the close.
  function closeIntoPin() {
    const pin = lbPin;
    lbPin = null;
    if (!pin) return false;
    if (fwd) fwd.cancel(); // closed before it finished opening
    const thumb = pin.querySelector(".pin-thumb");
    const done = () => { thumb.style.visibility = ""; idleUntil = performance.now() + 1500; };
    const visible = pin.style.visibility !== "hidden" && pin.style.opacity !== "0";
    if (reduceMotion || lbIndex !== 0 || !visible) { done(); return false; }
    const target = strip.querySelector("img.is-current");
    const from = thumb.getBoundingClientRect(), to = target.getBoundingClientRect();
    const ghost = makeGhost(target, to);
    lb.classList.remove("is-landing");
    // Hide the real photo only once the copy covering it is drawn.
    ghost.decode().catch(() => {}).then(() => {
      document.body.appendChild(ghost);
      lb.classList.add("is-morphing");
      const a = ghost.animate(morphFrames(from, to).reverse(), { ...MORPH, duration: 950, fill: "forwards" });
      a.finished.catch(() => {}).then(() => { done(); ghost.remove(); lb.classList.remove("is-morphing"); });
    });
    return true;
  }

  // A mouse wheel steps through the photos, one per scroll gesture (a
  // trackpad's sideways swipe still glides the strip natively).
  let lbWheelAt = 0, lbWheelSum = 0;
  lb.addEventListener("wheel", (e) => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
    e.preventDefault();
    const now = performance.now();
    if (now - lbWheelAt > 260) lbWheelSum = 0;
    lbWheelAt = now;
    if (lbWheelSum === null) return; // this gesture already moved one photo
    lbWheelSum += e.deltaY;
    if (Math.abs(lbWheelSum) > 40) { setCurrent(lbIndex + Math.sign(lbWheelSum)); lbWheelSum = null; }
  }, { passive: false });
  // Keep the counter in step when swiping the strip by hand.
  let scrollTimer;
  strip.addEventListener("scroll", () => {
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
      const mid = strip.scrollLeft + strip.clientWidth / 2;
      let best = 0, bestD = Infinity;
      strip.querySelectorAll("img").forEach((im, j) => {
        const d = Math.abs(im.offsetLeft + im.offsetWidth / 2 - mid);
        if (d < bestD) { bestD = d; best = j; }
      });
      if (best !== lbIndex) setCurrent(best, false);
    }, 90);
  });
  document.getElementById("lb-close").addEventListener("click", closeLightbox);
  lbPrev.addEventListener("click", () => setCurrent(lbIndex - 1));
  lbNext.addEventListener("click", () => setCurrent(lbIndex + 1));
  lb.addEventListener("click", (e) => { if (e.target === lb || e.target === strip) closeLightbox(); });
  addEventListener("keydown", (e) => {
    if (lb.classList.contains("is-open")) {
      if (e.key === "Escape") closeLightbox();
      if (e.key === "ArrowLeft") setCurrent(lbIndex - 1);
      if (e.key === "ArrowRight") setCurrent(lbIndex + 1);
    }
  });
  </script>
</body>
</html>
